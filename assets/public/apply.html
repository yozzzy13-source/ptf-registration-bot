:root{--card:#111010;--card2:#161514;--text:#EFEBE4;--muted:#8A7F6F;--dim:#B9B1A5;
  --accent:#E8A45C;--accent2:#C9873C;--border:#2A2521;--line2:#221F1B;
  --danger:#C2695E;--ok:#8FBF9A;--green:#8FBF9A;--green2:#8FBF9A}
body{background:#0A0A0B;padding:14px 12px 28px;font-size:15px}
.wrap{max-width:520px}
.card{border-radius:20px;padding:18px 16px;box-shadow:none;background:var(--card)}
h1{font-size:22px;line-height:1.2;margin:6px 0 10px}
p{font-size:14px;line-height:1.5}
.progress{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin-bottom:8px}
label{margin:12px 0 5px;font-size:12px;letter-spacing:.04em;color:var(--dim);font-weight:800}
input,select,textarea{padding:11px 13px;border-radius:13px;font-size:15px;background:var(--card2);border-color:var(--border)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);
  background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea{min-height:62px;font-size:15px}
.fhint{margin-top:5px;font-size:11.5px;line-height:1.45;color:var(--muted)}
button{border-radius:14px;padding:13px 16px;font-size:16px;margin-top:12px}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1A1208}
.secondary{background:var(--card2);border:1px solid var(--border)}
.lead{padding:14px;border-radius:16px}
.lead h3{font-size:15px}
.lead p{font-size:13px}
.perks li{padding:5px 0 5px 20px;font-size:13px}
.event,.ev{padding:13px 14px;border-radius:15px;background:var(--card2)}
.ev h4{font-size:15px}
.event-title{font-size:16px}
.pill{font-size:11px;padding:3px 8px}
.pill.open,.pill.live{background:rgba(143,191,154,.13);border-color:rgba(143,191,154,.5);color:var(--ok)}
.pill.wait{background:rgba(232,164,92,.12);border-color:rgba(232,164,92,.34);color:var(--accent)}
.pill.past{background:var(--card);color:var(--muted);border-color:var(--border)}
.small{font-size:12px;color:var(--muted)}
.grp{margin:16px 0 7px;color:var(--muted)}
.grp2{margin:14px 0 9px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stiles{grid-template-columns:repeat(3,1fr);gap:7px}
.stile{padding:9px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line2)}
.stile.tap{cursor:pointer;border-color:rgba(232,164,92,.3)}
.sv{font-size:16px;color:#D9C7A3}
.roster{margin-top:9px;border:1px solid var(--line2);border-radius:13px;overflow:hidden}
.rrow{display:flex;align-items:center;gap:9px;padding:7px 10px;border-bottom:1px solid var(--line2);background:var(--card)}
.rrow:last-child{border-bottom:0}
.rname{flex:1;font-size:13px;font-weight:700}
.rdiv{font-size:11px;color:var(--muted)}
.ava{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:0 0 30px;border:1px solid var(--border)}
.ava.ph{display:flex;align-items:center;justify-content:center;background:var(--card2);font-size:11px;font-weight:800;color:var(--muted)}
.fin{margin-bottom:9px;padding:14px 12px;border-radius:15px;background:var(--card);border:1px solid var(--line2);text-align:center}
.fin .ava{width:78px;height:78px;flex:0 0 78px;font-size:24px;margin:0 auto 8px;border-color:#A99167}
.finName{font-size:15px;font-weight:800}
.finSub{margin-top:3px;font-size:10px;letter-spacing:.1em;color:#D9C7A3;font-weight:800}
.finScore{margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:800;color:var(--accent)}
.finRu{margin-top:9px;padding-top:9px;border-top:1px solid var(--line2);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--dim)}
.finRu .ava{width:26px;height:26px;flex:0 0 26px;font-size:10px;margin:0}
.level-test{padding:12px;border-radius:15px;background:var(--card2)}
.checkbox{font-size:13px}
.participant-card,.inline-btn{border-radius:13px}
  </style>
</head>

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(v){return String(v||'').trim().toLowerCase()}
function isNo(v){return ['no','false','0','off','hidden','inactive','нет'].includes(norm(v))}
function pick(ev,base){return lang==='ru'?(ev[base+'_ru']||ev[base+'_en']||ev[base]||''):(ev[base+'_en']||ev[base+'_ru']||ev[base]||'')}
function splitBadges(text){return String(text||'').split(/\s*[|\n]\s*/).map(s=>s.trim()).filter(Boolean)}
function formatDate(v){if(!v)return '';const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v);return d.toLocaleDateString(lang==='ru'?'ru-RU':'en-US',{day:'numeric',month:'short',year:'numeric'})}
function evStatus(ev){return norm(ev.status_code||ev.status||'open')}
function statusLabel(ev,status){const custom=pick(ev,'status_label');if(custom)return custom;const x=L[lang];const s=status||evStatus(ev);if(s==='live')return x.live;if(s==='waitlist')return x.waitBadge;if(s==='archived')return x.pastBadge;return x.open}
function statusPill(s){return s==='live'?'live':(s==='waitlist'?'wait':(s==='archived'?'past':'open'))}
function showPrice(ev){return Number(ev.price_thb||0)>0 && !isNo(ev.show_price)}
function eventName(ev){return lang==='ru'?(ev.event_name_ru||ev.event_name_en||ev.event_name||ev.name):(ev.event_name_en||ev.event_name_ru||ev.event_name||ev.name)}
function eventDesc(ev){return lang==='ru'?(ev.description_ru||ev.description_en||ev.description||''):(ev.description_en||ev.description_ru||ev.description||'')}
function eventPriceUsdt(ev){return ev.price_usdt || ev.usdt_amount || ev.price_usd || ''}
function eventBadges(ev,status){
  // Single source of truth: every visible badge comes from the Events row.
  // If card_badges_ru/en is filled, show it exactly; otherwise build badges from core Events columns.
  const custom=splitBadges(pick(ev,'card_badges'));
  if(custom.length) return custom.map(t=>`<span class="pill">${esc(t)}</span>`).join('');
  const badges=[];
  badges.push({text:statusLabel(ev,status), cls:status==='live'?'live':'open'});
  const startLabel=pick(ev,'start_label');
  if(startLabel) badges.push({text:startLabel});
  else if(ev.start_date) badges.push({text:`${L[lang].start}: ${formatDate(ev.start_date)}`});
  const endLabel=pick(ev,'end_label');
  if(endLabel) badges.push({text:endLabel});
  else if(ev.end_date) badges.push({text:`${L[lang].end}: ${formatDate(ev.end_date)}`});
  const duration=pick(ev,'duration_label'); if(duration) badges.push({text:duration});
  const venue=pick(ev,'venue'); if(venue) badges.push({text:venue});
  if(ev.registration_deadline) badges.push({text:`${L[lang].deadline}: ${formatDate(ev.registration_deadline)}`});
  if(showPrice(ev)){
    const usdt=Number(eventPriceUsdt(ev)||0)>0?` / ${eventPriceUsdt(ev)} USDT`:'';
    badges.push({text:`${ev.price_thb} ${ev.currency||'THB'}${usdt}`, cls:'price'});
  }
  return badges.map(b=>`<span class="pill ${b.cls||''}">${esc(b.text)}</span>`).join('')
}
function eventPriceHtml(ev){
  if(!showPrice(ev)) return '';
  const usdt=Number(eventPriceUsdt(ev)||0)>0?` / ${esc(eventPriceUsdt(ev))} USDT`:'';
  return `<div class="event-price">${esc(L[lang].price)}: ${esc(ev.price_thb)} ${esc(ev.currency||'THB')}${usdt}</div>`;
}

// Старый тест усреднял 12 равноправных вопросов, поэтому самооценка техники
// («удары стабильные») вытягивала наверх даже тех, кто ни разу не играл
// счётный матч, и почти все получали 3.25–3.5. Теперь так:
//   • базу задаёт блок фактов (стаж, частота, детская секция, матчи, турниры,
//     результат против среднего любителя) — сразу в единицах NTRP;
//   • блок самооценки техники только сдвигает базу максимум на ±0.5;
//   • сверху лежат ограничители: без счётных матчей — не выше 2.5, без турниров
//     и без секции — не выше 3.5, выше 4.5 пускаем только с юниорским опытом.
// Отдельный случай — «занимался в детстве непрофессионально, потом вернулся»:
// такие игроки по опыту лиги почти никогда не бывают ниже 4.0, поэтому у них
// свой нижний порог, но потолок всё равно 4.5.

function ratingRound(v){return (Math.round(v*4)/4).toFixed(2).replace(/\.00$/,'.0').replace(/(\.\d)0$/,'$1')}
// Ограничители считаются отдельно от баллов: сначала нижний порог, потом
// потолок — потолок всегда главнее, иначе новичок с высокой самооценкой
// пролезал бы наверх.
function ratingFromAnswers(base,skill){
  let sum=0,weight=0;
  for(const q of RATING_BASE){const v=base[q.id];if(v==null)return '';const w=Number(q.w||1);sum+=v.value*w;weight+=w}
  let avg=0;for(const q of RATING_SKILL){const v=skill[q.id];if(v==null)return '';avg+=v}
  avg=avg/RATING_SKILL.length;
  let raw=sum/weight+Math.max(-0.5,Math.min(0.5,(avg-2.5)*0.33));
  const junior=base.junior?.key||'none', matches=base.matches?.key||'never',
        tours=base.tours?.key||'none', years=base.years?.key||'lt1', freq=base.freq?.key||'rare';
  let cap=5.0;
  if(junior!=='academy')cap=Math.min(cap,4.5);
  if(junior==='none'&&tours==='none')cap=Math.min(cap,3.5);
  if(freq==='rare'&&(matches==='never'||matches==='few'))cap=Math.min(cap,2.8);
  if(years==='lt1')cap=Math.min(cap,2.5);
  if(matches==='never')cap=Math.min(cap,2.5);
  let floor=2.0;
  if(['resumed','continuous','academy'].includes(junior)&&freq!=='rare'&&matches!=='never')floor=4.0;
  return ratingRound(Math.min(cap,Math.max(floor,raw)));
}
function ratingQuestionList(){
  return [...RATING_BASE.map(q=>({kind:'base',q})),...RATING_SKILL.map(q=>({kind:'skill',q}))];
}
function renderRatingTest(){const wrap=$('ratingQuestions');if(!wrap)return;wrap.innerHTML='';ratingQuestionList().forEach(({kind,q},i)=>{const div=document.createElement('div');div.className='test-q';const opts=['<option value=""></option>'].concat(q.o.map(o=>{const val=kind==='base'?o[0]:o[0];const label=kind==='base'?(lang==='ru'?o[2]:o[3]):(lang==='ru'?o[1]:o[2]);return `<option value="${esc(val)}">${esc(label)}</option>`})).join('');div.innerHTML=`<label>${esc(lang==='ru'?q.ru:q.en)}</label><select class="rating-q" data-kind="${kind}" data-id="${esc(q.id)}" data-i="${i}">${opts}</select>`;wrap.appendChild(div)});}
function calculateRating(){
  const base={},skill={};
  for(const q of RATING_BASE){const el=document.querySelector(`.rating-q[data-id="${q.id}"]`);const key=el?.value||'';if(!key)return '';const opt=q.o.find(o=>o[0]===key);if(!opt)return '';base[q.id]={key,value:opt[1]}}
  for(const q of RATING_SKILL){const el=document.querySelector(`.rating-q[data-id="${q.id}"]`);const v=Number(el?.value||0);if(!v)return '';skill[q.id]=v}
  return ratingFromAnswers(base,skill);
}
function updateRatingFromTest(){const rating=calculateRating();if(!rating){$('ratingResult').textContent=L[lang].ratingTestRequired;return ''}$('ntrp').value=rating;$('ratingResult').textContent=L[lang].ratingResult+rating;return rating;}

}
// Страна — тот же список, но с вводом: человек печатает первые буквы и выбирает.
const COUNTRIES_EN=['Argentina','Australia','Austria','Belarus','Belgium','Brazil','Bulgaria','Canada','Chile','China','Colombia','Croatia','Czechia','Denmark','Estonia','Finland','France','Georgia','Germany','Greece','Hong Kong','Hungary','India','Indonesia','Ireland','Israel','Italy','Japan','Kazakhstan','Kyrgyzstan','Latvia','Lithuania','Malaysia','Mexico','Moldova','Mongolia','Netherlands','New Zealand','Norway','Philippines','Poland','Portugal','Romania','Russia','Serbia','Singapore','Slovakia','Slovenia','South Africa','South Korea','Spain','Sweden','Switzerland','Taiwan','Thailand','Turkey','Ukraine','United Arab Emirates','United Kingdom','United States','Uzbekistan','Vietnam'];
const COUNTRIES_RU=['Австралия','Австрия','Азербайджан','Аргентина','Армения','Беларусь','Бельгия','Болгария','Бразилия','Великобритания','Венгрия','Вьетнам','Германия','Гонконг','Греция','Грузия','Дания','Израиль','Индия','Индонезия','Ирландия','Испания','Италия','Казахстан','Канада','Кипр','Киргизия','Китай','Колумбия','Латвия','Литва','Малайзия','Мексика','Молдова','Монголия','Нидерланды','Новая Зеландия','Норвегия','ОАЭ','Польша','Португалия','Россия','Румыния','Сербия','Сингапур','Словакия','Словения','США','Таиланд','Тайвань','Турция','Узбекистан','Украина','Филиппины','Финляндия','Франция','Хорватия','Черногория','Чехия','Швейцария','Швеция','Эстония','ЮАР','Южная Корея','Япония'];
function fillCountryList(){
  const dl=$('countryList'),input=$('country');if(!dl)return;
  const list=lang==='ru'?COUNTRIES_RU:COUNTRIES_EN;
  dl.innerHTML=list.map(c=>'<option value="'+esc(c)+'"></option>').join('');
  if(input&&!input.placeholder)input.placeholder=L[lang].countryPick;
}
function applyLang(){const x=L[lang],wait=mode==='waitlist';$('progress').textContent=x.progressIntro;$('title').textContent=wait?(lang==='ru'?'Лист ожидания следующего сезона 🎾':'Next-season waitlist 🎾'):(mode==='event'?x.titleEvent:(mode==='rating'?x.ratingUpdateTitle:x.titleProfile));$('intro').textContent=wait?(lang==='ru'?'Заполните анкету для листа ожидания следующего сезона. Места в каждом сезоне ограничены: участники листа получают информацию о наборе и приоритет раньше других.':'Complete your profile for the next-season waitlist. Every season has limited places: waitlist players receive registration updates and priority first.'):(mode==='event'?(profileCompleted?x.alreadyProfile:x.introEvent):(mode==='rating'?x.ratingUpdateIntro:x.introProfile));$('startBtn2').textContent=$('startBtn').textContent=mode==='event'?x.startEvent:(mode==='rating'?x.ratingSave:x.startProfile);$('progress2').textContent=mode==='rating'?'':x.progressProfile;$('progress3').textContent=x.progressEvent;$('profileTitle').textContent=mode==='rating'?x.ratingUpdateTitle:x.profileTitle;$('nameLabel').textContent=x.name;$('nameHint').textContent=x.nameHint;$('genderLabel').textContent=x.gender;$('ageLabel').textContent=x.age;$('countryLabel').textContent=x.country;$('experienceLabel').textContent=x.experience;$('experienceHint').textContent=x.experienceHint;$('ntrpLabel').textContent=x.ntrp;$('ntrpUnknownText').textContent=x.ntrpUnknown;$('whatsappLabel').textContent=x.whatsapp;$('instagramLabel').textContent=x.instagram;$('instagramHint').textContent=x.instagramHint;$('notesLabel').textContent=x.notes;$('divisionNote').textContent=x.divisionNote;$('nextEventBtn').textContent=mode==='rating'?x.ratingSave:x.next;$('backIntroBtn').textContent=x.back;$('eventTitle').textContent=x.eventTitle;$('eventHint').textContent=mode==='event'?(profileCompleted?x.eventHintFound:x.eventHintEvent):x.eventHintProfile;$('submitBtn').textContent=x.submit;$('backBtn').textContent=x.back;$('doneTitle').textContent=x.doneTitle;$('doneText').textContent=x.doneText;$('closeBtn').textContent=x.close;$('openLeagueBtn').textContent=x.openLeague;$('openLeagueBtn').classList.toggle('hidden',!(profileCompleted||profileSaved));$('ratingTestIntro').textContent=x.ratingTestIntro;$('calcRatingBtn').textContent=x.ratingCalc;renderRatingTest();fillAgeOptions();fillCountryList();applyRatingOnlyMode()}
function setDisplay(id, display){const el=$(id); if(el) el.style.display=display}
function applyRatingOnlyMode(){const only=mode==='rating';['nameLabel','name','genderLabel','gender','ageWrap','countryLabel','country','experienceLabel','experience','whatsappLabel','whatsapp','instagramLabel','instagram','instagramHint','notesLabel','notes','divisionNote'].forEach(id=>setDisplay(id, only?'none':'')); if(only){$('ntrpUnknown').checked=true;$('ratingTest').classList.remove('hidden');renderRatingTest();}}
// Стартовый экран новичка. Он должен отвечать на два вопроса сразу: что тут
// вообще происходит и что от меня требуется. Поэтому сверху — зачем нужна
// анкета и что после неё открывается, ниже — живая витрина событий: что идёт,
// куда открыт набор, куда пишут в лист ожидания и что уже прошло.
// Про Fantasy здесь не говорим: он только для участников лиги.
let seasonInfo={},rosterOpen='';
function seasonNoOf(ev){const m=String(ev.event_id||'').match(/(\d+)/)||String(eventName(ev)||'').match(/(\d+)/);return m?String(m[1]):''}
function statTile(v,k,onclick){return '<div class="stile'+(onclick?' tap':'')+'"'+(onclick?' onclick="'+onclick+'"':'')
  +'><div class="sv">'+esc(v)+'</div><div class="sk">'+esc(k)+(onclick?' ▾':'')+'</div></div>'}
function avatar(name,photo){
  const ini=String(name||'?').trim().split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
  return photo?'<img class="ava" src="'+esc(photo)+'" alt="">':'<div class="ava ph">'+esc(ini)+'</div>';
}
// Финал дивизиона — так же, как лига показывает его у себя на главной.
function finalCard(f){
  let h='<div class="fin"><div class="finTop">'+avatar(f.champion.name,f.champion.photo)
    +'<div class="finName">'+esc(f.champion.name)+'</div>'
    +'<div class="finSub">'+esc((f.title||('Division '+f.letter))+' '+(lang==='ru'?'ЧЕМПИОН':'CHAMPION'))+'</div></div>';
  if(f.score)h+='<div class="finScore">'+esc(f.score)+'</div>';
  if(f.runner_up&&f.runner_up.name)h+='<div class="finRu">'+avatar(f.runner_up.name,f.runner_up.photo)+'<span>'+esc(f.runner_up.name)+'</span></div>';
  return h+'</div>';
}
function rosterList(list){
  return '<div class="roster">'+list.map(p=>'<div class="rrow">'+avatar(p.name,p.photo)
    +'<div class="rname">'+esc(p.name)+'</div>'+(p.division?'<div class="rdiv">'+esc(p.division)+'</div>':'')+'</div>').join('')+'</div>';
}
function toggleRoster(no){rosterOpen=(rosterOpen===no?'':no);renderIntro()}
function introEventCard(ev,past){
  const s=evStatus(ev),x=L[lang];
  const desc=eventDesc(ev);
  const dates=[ev.start_date?formatDate(ev.start_date):'',ev.end_date?formatDate(ev.end_date):''].filter(Boolean).join(' — ');
  const note=s==='waitlist'?x.waitNote:'';
  const no=seasonNoOf(ev),info=seasonInfo[no]||null;
  // Длительность — по реально сыгранным матчам сезона, а не по плановым датам.
  const weeks=Number(info?.weeks||0);
  const players=Number(info?.players||0),divs=Number(info?.divisions||0);
  const roster=(info&&info.players_list)||[];
  const tiles=(divs||players||weeks)?('<div class="stiles">'
    +(divs?statTile(divs,x.tDivisions):'')
    +(players?statTile(players,x.tPlayers,roster.length?"toggleRoster('"+no+"')":''):'')
    +(weeks?statTile(weeks+(lang==='ru'?' нед.':'w'),x.tDuration):'')+'</div>'):'';
  const finals=(info&&info.finals)||[];
  return '<div class="ev'+(past?' past':'')+'">'
    +'<h4>'+esc(eventName(ev))+'</h4>'
    +'<div><span class="pill '+statusPill(s)+'">'+esc(statusLabel(ev,s))+'</span>'
    +(dates?'<span class="pill">'+esc(dates)+'</span>':'')+'</div>'
    +(desc&&!past?'<div class="small" style="margin-top:8px">'+esc(desc)+'</div>':'')
    +tiles
    +(rosterOpen===no&&roster.length?rosterList(roster):'')
    +(finals.length?'<div class="grp2">'+esc(x.grpFinals)+'</div>'+finals.map(finalCard).join(''):'')
    +(note?'<div class="small" style="margin-top:8px">'+esc(note)+'</div>':'')
    +'</div>';
}
function renderIntro(){
  const lead=$('introLead'),box=$('introEvents'),x=L[lang];
  if(!lead||!box)return;
  if(mode==='rating'){lead.innerHTML='';box.innerHTML='';return}
  lead.innerHTML='<div class="lead"><h3>'+esc(profileCompleted?x.leadDone:x.leadTitle)+'</h3>'
    +'<p>'+esc(profileCompleted?x.leadDoneText:x.leadText)+'</p>'
    +(profileCompleted?'':'<ul class="perks">'+x.perks.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>')
    +'</div>';
  const list=(allEvents.length?allEvents:events);
  const by=s=>list.filter(ev=>evStatus(ev)===s);
  const live=by('live'),open=by('open'),wait=by('waitlist'),past=by('archived');
  let h='';
  const group=(title,rows,isPast)=>rows.length?('<div class="grp">'+esc(title)+'</div>'+rows.map(ev=>introEventCard(ev,isPast)).join('')):'';
  h+=group(x.grpLive,live,false);
  h+=group(x.grpOpen,open,false);
  h+=group(x.grpWait,wait,false);
  if(!live.length&&!open.length&&!wait.length)h+='<div class="small" style="margin-top:14px">'+esc(x.noEventsNow)+'</div>';
  h+=group(x.grpPast,past,true);
  if(!profileCompleted&&(open.length||wait.length))h+='<div class="stepnote">'+esc(x.needProfileCard)+' → '+esc(x.progressProfile)+'</div>';
  box.innerHTML=h;
}
function renderEvents(){const box=$('events');box.innerHTML='';const x=L[lang];if(mode==='waitlist'){const note=document.createElement('div');note.className='event active';note.innerHTML='<div class="event-title">📝 '+(lang==='ru'?'Лист ожидания':'Waitlist')+'</div><div class="small">'+(lang==='ru'?'Вы записываетесь не в текущий сезон. Мы сообщим о следующем наборе одним из первых; места ограничены.':'You are joining the waitlist, not the current season. We will notify you early when the next season opens; places are limited.')+'</div>';box.appendChild(note)}else if(mode!=='event'){const profileOnly=document.createElement('div');profileOnly.className='event'+(selectedEvent===''?' active':'');profileOnly.innerHTML=`<div class="event-title">${esc(x.profileOnly)}</div><div class="small">${esc(x.profileOnlyText)}</div>`;profileOnly.onclick=()=>{selectedEvent='';renderEvents()};box.appendChild(profileOnly)}
  if(!events.length){const empty=document.createElement('p');empty.className='small';empty.textContent=x.noEvents;box.appendChild(empty)}
  events.forEach(ev=>{const name=eventName(ev);const desc=eventDesc(ev);const status=evStatus(ev);const selectable=!isNo(ev.selectable)&&(ev.joinable!==false)&&status!=='live'&&status!=='archived';const div=document.createElement('div');div.className='event'+(selectedEvent===ev.event_id?' active':'')+(selectable?'':' muted');const price=eventPriceHtml(ev);const count=Number(ev.applications_count||ev.players_count||0);const stats=`<div class="statline">${esc(x.applications)}: ${esc(count)}</div>`;div.innerHTML=`<div class="event-title">${esc(name)}</div><div class="small">${esc(desc||'')}</div><div style="margin-top:10px">${eventBadges(ev,status)}</div>${price}${stats}<div class="event-actions"><button type="button" class="inline-btn" data-event-id="${esc(ev.event_id)}">${esc(x.viewPlayers)}</button></div>`;div.onclick=()=>{if(!selectable)return;selectedEvent=ev.event_id;renderEvents()};div.querySelector('button[data-event-id]').onclick=(e)=>{e.stopPropagation();openParticipantsPage(ev)};box.appendChild(div)})}
function openParticipantsPage(ev){
  // Состав смотрим того сезона, к которому относится событие: у сезона 3
  // своя вкладка, и пустой список там — это нормально, состав ещё собирают.
  const no=ev?seasonNoOf(ev):'';
  goto('/participants?back=event'+(no?'&season='+encodeURIComponent(no):''));
}
// Цифры прошлых сезонов и чемпионы: они и продают участие лучше любого текста.
async function loadSeasonInfo(){
  try{
    const r=await fetch('/api/public/seasons',{cache:'no-store'});
    const j=await r.json();
    (j.seasons||[]).forEach(x=>{seasonInfo[String(x.number)]=x});
    renderIntro();
  }catch(e){/* без цифр экран просто чуть суше */}
}
async function bootstrap(){try{const r=await fetch('/api/bootstrap?initData='+encodeURIComponent(initData)+tokQ);const j=await r.json();if(!j.ok)throw new Error(j.error||'Bootstrap error');lang=j.lang||'en';events=j.events||[];allEvents=j.all_events||j.events||[];existingProfile=j.existingProfile||null;profileCompleted=Boolean(j.profileCompleted);const u=j.user||{};$('name').value=[u.first_name,u.last_name].filter(Boolean).join(' ');if(existingProfile)fillProfile(existingProfile);loadSeasonInfo();if(mode==='rating'){applyLang();renderIntro();show('stepProfile');return}if(mode==='profile'&&profileCompleted){mode='event';applyLang();renderIntro();renderEvents();show('stepEvent');return}applyLang();renderIntro();renderEvents();loadSeasonInfo()}catch(e){applyLang();$('events').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
// Подставляем то, что уже есть в анкете: человек не должен вводить заново
// имя, страну и рейтинг только потому, что зашёл со второго раза.
function fillProfile(a){
  if(!a)return;
  const set=(id,v)=>{const el=$(id);if(el&&v!==undefined&&v!==null&&String(v)!=='')el.value=String(v)};
  set('name',a.name);set('gender',a.gender);set('age',a.age);
  set('country',a.country_of_origin||a.country);set('experience',a.experience);
  set('ntrp',['unknown','n/a','na','-'].includes(String(a.ntrp||'').toLowerCase())?'':a.ntrp);
  set('whatsapp',a.whatsapp);set('instagram',a.instagram);set('notes',a.notes);
}
function profileFromForm(){let rating=$('ntrp').value.trim();let source='player';if($('ntrpUnknown').checked){const calc=calculateRating();if(calc){rating=calc;source='test'}}return {name:$('name').value.trim(),gender:$('gender').value,age:$('age').value.trim(),country_of_origin:$('country').value.trim(),experience:$('experience').value.trim(),ntrp:rating,ntrp_source:source,ntrp_unknown:false,racket_rating:rating,whatsapp:$('whatsapp').value.trim(),instagram:$('instagram').value.trim(),notes:$('notes').value.trim()}}
function validateProfile(profile){const missing=[];if(!profile.name)missing.push(L[lang].name);if(!profile.gender)missing.push(L[lang].gender);if(!profile.country_of_origin)missing.push(L[lang].country);if(!profile.experience)missing.push(L[lang].experience);if(!profile.ntrp || ['unknown','не знаю','n/a','na','-'].includes(String(profile.ntrp).trim().toLowerCase()))missing.push(L[lang].ntrp);if(!profile.whatsapp)missing.push(L[lang].whatsapp);return missing}
async function saveProfileAndContinue(){const p=profileFromForm();if(mode==='rating'){if(!p.ntrp){$('profileMsg').className='error';$('profileMsg').textContent=L[lang].ratingTestRequired;return}try{const r=await fetch('/api/update-rating',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,t:linkToken,rating:p.ntrp,ntrp_source:p.ntrp_source})});const j=await r.json();if(!j.ok)throw new Error(j.error||'Save error');$('doneTitle').textContent=L[lang].doneTitle;$('doneText').textContent=L[lang].ratingSaved;$('doneActionBtn').classList.add('hidden');show('stepDone')}catch(e){$('profileMsg').className='error';$('profileMsg').textContent=e.message}return}const missing=validateProfile(p);if(missing.length){$('profileMsg').className='error';$('profileMsg').textContent=L[lang].requiredBase+missing.join(', ');return}try{const r=await fetch('/api/save-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,t:linkToken,profile:p})});const j=await r.json();if(!j.ok)throw new Error(j.error||'Save error');profileSaved=true;profileCompleted=true;existingProfile=j.applicant||existingProfile;$('profileMsg').className='ok';$('profileMsg').textContent=L[lang].profileSaved;renderEvents();show('stepEvent')}catch(e){$('profileMsg').className='error';$('profileMsg').textContent=e.message}}
async function submitApplication(){const p=profileFromForm();if(!profileCompleted&&!profileSaved){const missing=validateProfile(p);if(missing.length){$('msg').className='error';$('msg').textContent=L[lang].requiredBase+missing.join(', ');return}}if(mode==='event'&&!selectedEvent){$('msg').className='error';$('msg').textContent=lang==='ru'?'Пожалуйста, выберите событие.':'Please choose an event.';return}try{$('msg').textContent='';const r=await fetch('/api/submit-application',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,t:linkToken,profile:p,event_id:selectedEvent,mode})});const j=await r.json();if(!j.ok)throw new Error(j.error||'Submit error');
    if(selectedEvent && j.payment_required){
      $('doneTitle').textContent=lang==='ru'?'Оплата участия':'Payment required';
      $('doneText').textContent=lang==='ru'?'Заявка на событие сохранена. Следующий шаг — оплата участия. Вернитесь в чат Telegram-бота и выберите способ оплаты. Неоплаченная заявка не является активным участием. Оплаченные заявки будут рассматриваться в первую очередь.':'Your event application has been saved. Next step — participation payment. Return to the Telegram bot chat and choose a payment method. An unpaid application is not an active entry. Paid applications will be processed first.';
    } else {
      $('doneTitle').textContent=L[lang].doneTitle;
      $('doneText').textContent=selectedEvent?L[lang].doneTextEvent:(mode==='waitlist'?(lang==='ru'?'Вы в листе ожидания следующего сезона. Мы сообщим о наборе одним из первых; места ограничены.':'You are on the next-season waitlist. We will notify you early when registration opens; places are limited.'):(lang==='ru'?'Анкета сохранена в системе PTF. Теперь вы можете подать заявку в открытое событие.':'Your profile has been saved in the PTF system. You can now join an open event.'));
    }
    $('doneActionBtn').textContent=L[lang].joinEventNow;
    $('doneActionBtn').classList.toggle('hidden', Boolean(selectedEvent));
    show('stepDone')}catch(e){$('msg').className='error';$('msg').textContent=e.message}}
$('gender').onchange=()=>{$('ageWrap').style.display=$('gender').value==='female'?'none':'block'};
$('ntrpUnknown').onchange=()=>{$('ratingTest').classList.toggle('hidden',!$('ntrpUnknown').checked);if($('ntrpUnknown').checked){$('ntrp').value='';renderRatingTest();}};
$('calcRatingBtn').onclick=updateRatingFromTest;
$('startBtn2').onclick=()=>$('startBtn').click();
$('startBtn').onclick=()=>{if(mode==='rating'){show('stepProfile');applyRatingOnlyMode()}else if(profileCompleted){mode='event';applyLang();show('stepEvent');renderEvents()}else show('stepProfile')};
$('nextEventBtn').onclick=saveProfileAndContinue;
$('submitBtn').onclick=submitApplication;
$('backBtn').onclick=()=>{if(mode==='event')show('stepIntro');else show('stepProfile')};
$('backIntroBtn').onclick=()=>show('stepIntro');
$('doneActionBtn').onclick=()=>{selectedEvent='';mode='event';show('stepEvent');renderEvents()};
$('openLeagueBtn').onclick=()=>goto('/league');
$('closeBtn').onclick=()=>{if(tg)tg.close();else location.href='/'};
bootstrap();
</script>
