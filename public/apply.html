<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>PTF Registration</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--card:#222;--card2:#2b2b2b;--text:#f6f4ef;--muted:#b9b3aa;--accent:#ef5f00;--accent2:#ff8a2a;--border:#444;--danger:#ff6b6b;--ok:#8dff9f;--green:#19c37d;--green2:#7cffb2}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#111,#1b1b1b);color:var(--text);min-height:100vh;padding:18px}.wrap{max-width:560px;margin:0 auto}.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}h1{font-size:30px;line-height:1.1;margin:8px 0 16px}p{color:var(--muted);font-size:16px;line-height:1.55}.progress{color:var(--muted);font-size:13px;margin-bottom:12px}label{display:block;margin:14px 0 6px;color:#ddd;font-weight:700}input,select,textarea{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:16px}textarea{min-height:84px;resize:vertical}button{width:100%;border:0;border-radius:18px;padding:16px 18px;font-size:18px;font-weight:900;margin-top:16px;cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#111}.secondary{background:#272727;color:var(--text);border:1px solid var(--border)}.hidden{display:none}.events{display:grid;gap:12px;margin-top:12px}.event{padding:16px;border:1px solid var(--border);border-radius:16px;background:#1f1f1f;cursor:pointer}.event.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(239,95,0,.35) inset}.event.muted{cursor:default;opacity:.92}.event-title{font-size:18px;font-weight:900;margin-bottom:6px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#303030;border:1px solid var(--border);color:var(--muted);font-size:12px;margin:3px 4px 3px 0}.pill.live{background:rgba(25,195,125,.16);border-color:var(--green);color:var(--green2);animation:pulse 1.15s infinite}.pill.open{background:rgba(25,195,125,.14);border-color:var(--green);color:var(--green2)}.small{font-size:12px;color:var(--muted)}.error{color:var(--danger);margin-top:10px}.ok{color:var(--ok);margin-top:10px}.checkbox{display:flex;gap:10px;align-items:center;margin-top:10px}.checkbox input{width:auto}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(25,195,125,.55)}70%{box-shadow:0 0 0 8px rgba(25,195,125,0)}100%{box-shadow:0 0 0 0 rgba(25,195,125,0)}}</style></head><body><div class="wrap"><div class="card">
<section id="stepIntro"><div class="progress" id="progress"></div><h1 id="title"></h1><p id="intro"></p><button class="primary" id="startBtn"></button></section>
<section id="stepProfile" class="hidden"><div class="progress" id="progress2"></div><h1 id="profileTitle"></h1><label id="nameLabel"></label><input id="name"/><label id="genderLabel"></label><select id="gender"><option value=""></option><option value="male">Male</option><option value="female">Female</option></select><div id="ageWrap"><label id="ageLabel"></label><input id="age" inputmode="numeric"/></div><label id="countryLabel"></label><input id="country"/><label id="experienceLabel"></label><input id="experience"/><label id="ntrpLabel"></label><input id="ntrp" placeholder="3.5 / 4.0"/><label class="checkbox"><input type="checkbox" id="ntrpUnknown"><span id="ntrpUnknownText"></span></label><label id="whatsappLabel"></label><input id="whatsapp"/><label id="notesLabel"></label><textarea id="notes"></textarea><p class="small" id="divisionNote"></p><button class="primary" id="nextEventBtn"></button><button class="secondary" id="backIntroBtn"></button><div id="profileMsg"></div></section>
<section id="stepEvent" class="hidden"><div class="progress" id="progress3"></div><h1 id="eventTitle"></h1><p id="eventHint"></p><div class="events" id="events"></div><button class="primary" id="submitBtn"></button><button class="secondary" id="backBtn"></button><div id="msg"></div></section>
<section id="stepDone" class="hidden"><h1 id="doneTitle"></h1><p id="doneText"></p><button class="primary" id="closeBtn"></button></section></div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.expand();tg.ready()}const initData=tg?.initData||'';const params=new URLSearchParams(location.search);let mode=params.get('mode')||'profile';let lang='en',selectedEvent='',events=[],existingProfile=null,profileCompleted=false,profileSaved=false;
const L={ru:{progressIntro:'Шаг 1/3',progressProfile:'Шаг 2/3',progressEvent:'Шаг 3/3',titleProfile:'Анкета Phuket Tennis Family 🎾',titleEvent:'Участие в событии PTF 🏆',introProfile:'Заполните короткую анкету игрока. После сохранения профиль уже будет в системе PTF, а на следующем шаге вы сможете выбрать событие или просто остаться в waitlist. Очередь среди новых игроков формируется по дате заполнения анкеты.',introEvent:'Выберите событие, куда хотите оставить заявку. Если у вас уже есть заполненная анкета, повторно заполнять её не нужно.',startProfile:'Начать анкету',startEvent:'Продолжить',profileTitle:'Анкета игрока',name:'Имя и фамилия',gender:'Пол',age:'Возраст',country:'Страна',experience:'Опыт игры',ntrp:'Примерный NTRP',ntrpUnknown:'Я не знаю свой уровень',whatsapp:'WhatsApp',notes:'Комментарий / пожелания',divisionNote:'При первом участии дивизион назначает организатор на основе вашего уровня, опыта и текущего состава игроков.',next:'Сохранить анкету и перейти дальше',eventTitle:'Выберите событие',eventHintProfile:'Анкета уже сохраняется после предыдущего шага. Здесь можно выбрать событие для заявки или оставить профиль в waitlist PTF без выбора события.',eventHintEvent:'Выберите событие для участия. Если сейчас вы не готовы выбирать событие, можно просто сохранить профиль в waitlist.',submit:'Отправить',back:'Назад',doneTitle:'Готово ✅',doneText:'Ваша анкета сохранена в системе PTF. Вы добавлены в waitlist и будете получать уведомления о подходящих событиях.',doneTextEvent:'Заявка сохранена. Вы добавлены в waitlist выбранного события. Детали по оплате и подтверждению участия будут отправлены позже через Telegram-бота.',close:'Закрыть',requiredBase:'Пожалуйста, заполните: ',profileOnly:'Сохранить анкету в waitlist',profileOnlyText:'Вы можете не выбирать событие сейчас. Анкета останется в системе PTF, и бот сообщит о новых наборах и открытых событиях.',alreadyProfile:'Мы нашли вашу анкету в системе PTF. Можно сразу выбрать событие.',needProfile:'Мы не нашли to the waitlist and will receive updates about suitable events.',doneTextEvent:'Your application has been saved. You have been added to the selected event waitlist. Payment and participation confirmation details will be sent later through the Telegram bot.',close:'Close',requiredBase:'Please fill: ',profileOnly:'Save profile to waitlist',profileOnlyText:'You can choose no event now. Your profile will stay in the PTF system, and the bot will notify you about new openings and events.',alreadyProfile:'We found your profile in the PTF system. You can choose an event directly.',needProfile:'We could not find a completed profile. Please complete a short player profile first.',profileSaved:'Profile saved. Now you can choose an event or keep your profile in the waitlist.',status:'Status',limited:'Limited spots',open:'Registration open',live:'Live now',waitlist:'Registration open',status_live:'Live',status_waitlist:'Registration open',status_active:'Registration open',players:'32 players',divisions:'4 divisions',playoffs:'Playoffs: June 27–28',venue:'The Peak Racquet Park',expectedStart:'Start: mid–late August',duration:'2 months',queue:'Waitlist'}};
const $=id=>document.getElementById(id);function show(id){['stepIntro','stepProfile','stepEvent','stepDone'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function fillProfile(u={}){if(u.name)$('name').value=u.name;if(u.gender)$('gender').value=u.gender;if(u.age)$('age').value=u.age;if(u.country_of_origin)$('country').value=u.country_of_origin;if(u.experience)$('experience').value=u.experience;if(u.ntrp)$('ntrp').value=u.ntrp==='unknown'?'':u.ntrp;if(u.ntrp==='unknown')$('ntrpUnknown').checked=true;if(u.whatsapp)$('whatsapp').value=u.whatsapp;if(u.notes)$('notes').value=u.notes;$('gender').onchange()}function applyLang(){const x=L[lang];$('progress').textContent=x.progressIntro;$('title').textContent=mode==='event'?x.titleEvent:x.titleProfile;$('intro').textContent=mode==='event'?(profileCompleted?x.alreadyProfile:x.introEvent):x.introProfile;$('startBtn').textContent=mode==='event'?x.startEvent:x.startProfile;$('progress2').textContent=x.progressProfile;$('progress3').textContent=x.progressEvent;$('profileTitle').textContent=x.profileTitle;$('nameLabel').textContent=x.name;$('genderLabel').textContent=x.gender;$('ageLabel').textContent=x.age;$('countryLabel').textContent=x.country;$('experienceLabel').textContent=x.experience;$('ntrpLabel').textContent=x.ntrp;$('ntrpUnknownText').textContent=x.ntrpUnknown;$('whatsappLabel').textContent=x.whatsapp;$('notesLabel').textContent=x.notes;$('divisionNote').textContent=x.divisionNote;$('nextEventBtn').textContent=x.next;$('backIntroBtn').textContent=x.back;$('eventTitle').textContent=x.eventTitle;$('eventHint').textContent=mode==='event'?x.eventHintEvent:x.eventHintProfile;$('submitBtn').textContent=x.submit;$('backBtn').textContent=x.back;$('doneTitle').textContent=x.doneTitle;$('doneText').textContent=x.doneText;$('closeBtn').textContent=x.close}function eventBadges(ev,status){const x=L[lang];if(String(ev.event_id)==='current_s1')return `<span class="pill live">${x.status_live}</span><span class="pill">${x.players}</span><span class="pill">${x.divisions}</span><span class="pill">${x.playoffs}</span><span class="pill">${x.venue}</span>`;if(String(ev.event_id)==='league_s2')return `<span class="pill open">${x.status_waitlist}</span><span class="pill">${x.limited}</span><span class="pill">${x.expectedStart}</span><span class="pill">${x.duration}</span><span class="pill">${x.queue}</span>`;const cls=status==='live'?' live':(status==='waitlist'||status==='active'?' open':'');const statusLabel=x['status_'+status]||x.open;return `<span class="pill${cls}">${x.status}: ${statusLabel}</span>`}function renderEvents(){const box=$('events');box.innerHTML='';const x=L[lang];const profileOnly=document.createElement('div');profileOnly.className='event'+(selectedEvent===''?' active':'');profileOnly.innerHTML=`<div class="event-title">${x.profileOnly}</div><div class="small">${x.profileOnlyText}</div>`;profileOnly.onclick=()=>{selectedEvent='';renderEvents()};box.appendChild(profileOnly);events.forEach(ev=>{const name=lang==='ru'?(ev.event_name_ru||ev.event_name_en):(ev.event_name_en||ev.event_name_ru);let desc=lang==='ru'?(ev.description_ru||ev.description_en):(ev.description_en||ev.description_ru);if(String(ev.event_id)==='current_s1')desc=lang==='ru'?'Первый сезон лиги проходит сейчас.':'The first league season is currently underway.';if(String(ev.event_id)==='league_s2')desc=lang==='ru'?'Открыт приём заявок во Второй сезон. Финальное количество мест определим после завершения регистрации. Приоритет получают игроки с предыдущим опытом участия в PTF.':'Applications are open for Season 2. The final number of places will be confirmed after registration closes. Priority is given to players with previous PTF experience.';const status=String(ev.status||'active').toLowerCase();const selectable=status!=='live';const div=document.createElement('div');div.className='event'+(selectedEvent===ev.event_id?' active':'')+(selectable?'':' muted');div.innerHTML=`<div class="event-title">${name}</div><div class="small">${desc||''}</div><div style="margin-top:10px">${eventBadges(ev,status)}</div>`;div.onclick=()=>{if(!selectable)return;selectedEvent=ev.event_id;renderEvents()};box.appendChild(div)})}async function bootstrap(){try{const r=await fetch('/api/bootstrap?initData='+encodeURIComponent(initData));const j=await r.json();if(!j.ok)throw new Error(j.error||'Bootstrap error');lang=j.lang||'en';events=j.events||[];existingProfile=j.existingProfile||null;profileCompleted=Boolean(j.profileCompleted);const u=j.user||{};$('name').value=[u.first_name,u.last_name].filter(Boolean).join(' ');if(existingProfile)fillProfile(existingProfile);applyLang();renderEvents()}catch(e){applyLang();$('events').innerHTML=`<p class="error">${e.message}</p>`}}function profileFromForm(){return {name:$('name').value.trim(),gender:$('gender').value,age:$('age').value.trim(),country_of_origin:$('country').value.trim(),experience:$('experience').value.trim(),ntrp:$('ntrp').value.trim(),ntrp_unknown:$('ntrpUnknown').checked,whatsapp:$('whatsapp').value.trim(),notes:$('notes').value.trim()}}function validateProfile(profile){const missing=[];if(!profile.name)missing.push(L[lang].name);if(!profile.gender)missing.push(L[lang].gender);if(!profile.country_of_origin)missing.push(L[lang].country);if(!profile.experience)missing.push(L[lang].experience);if(!profile.whatsapp)missing.push(L[lang].whatsapp);return missing}async function saveProfileAndContinue(){const p=profileFromForm();const missing=validateProfile(p);if(missing.length){$('profileMsg').className='error';$('profileMsg').textContent=L[lang].requiredBase+missing.join(', ');return}$('profileMsg').className='';$('profileMsg').textContent='';$('nextEventBtn').disabled=true;const oldText=$('nextEventBtn').textContent;$('nextEventBtn').textContent='...';try{const r=await fetch('/api/save-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,profile:p})});const j=await r.json();if(!j.ok)throw new Error(j.error||'Error');existingProfile=j.applicant||p;profileCompleted=true;profileSaved=true;$('profileMsg').className='ok';$('profileMsg').textContent=L[lang].profileSaved;show('stepEvent')}catch(e){$('profileMsg').className='error';$('profileMsg').textContent=e.message}finally{$('nextEventBtn').disabled=false;$('nextEventBtn').textContent=oldText}}$('gender').onchange=()=>{$('ageWrap').style.display=$('gender').value==='female'?'none':'block'};$('startBtn').onclick=()=>{if(mode==='event'&&profileCompleted){show('stepEvent')}else{if(mode==='event'&&!profileCompleted){$('profileMsg').className='ok';$('profileMsg').textContent=L[lang].needProfile}show('stepProfile')}};$('backIntroBtn').onclick=()=>show('stepIntro');$('nextEventBtn').onclick=saveProfileAndContinue;$('backBtn').onclick=()=>{if(mode==='event'&&profileCompleted)show('stepIntro');else show('stepProfile')};$('submitBtn').onclick=async()=>{$('msg').innerHTML='';$('msg').className='';let profile=profileFromForm();if((mode==='event'||profileSaved)&&profileCompleted&&existingProfile)profile={...existingProfile,ntrp_unknown:existingProfile.ntrp==='unknown'};const missing=validateProfile(profile);if(missing.length){$('msg').className='error';$('msg').textContent=L[lang].requiredBase+missing.join(', ');return}$('submitBtn').disabled=true;$('submitBtn').textContent='...';try{const r=await fetch('/api/submit-application',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,profile,event_id:selectedEvent||'',mode})});const j=await r.json();if(!j.ok)throw new Error(j.error||'Error');$('doneText').textContent=selectedEvent?L[lang].doneTextEvent:L[lang].doneText;show('stepDone');if(tg)tg.HapticFeedback?.notificationOccurred('success')}catch(e){$('msg').className='error';$('msg').textContent=e.message;$('submitBtn').disabled=false;$('submitBtn').textContent=L[lang].submit}};$('closeBtn').onclick=()=>tg?tg.close():null;bootstrap();</script></body></html>
