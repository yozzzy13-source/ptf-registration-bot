<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>PTF Application</title>
  <style>
    :root{
      --bg:#151515;
      --bg2:#202020;
      --card:#2b2b2b;
      --field:#1f1f1f;
      --text:#f8f5ef;
      --muted:#c7c0b5;
      --accent:#EF5F00;
      --accent2:#ff7a1a;
      --border:#44403a;
      --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),#111);color:var(--text)}
    .wrap{max-width:560px;margin:0 auto;padding:18px}
    .card{background:linear-gradient(180deg,var(--card),#242424);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
    h1{margin:0 0 10px;font-size:25px;line-height:1.15}
    p{color:var(--muted);line-height:1.5}
    label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
    input,select,textarea{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--border);background:var(--field);color:var(--text);font-size:16px;outline:none}
    textarea{min-height:90px;resize:vertical}
    button{width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:800;margin-top:14px;cursor:pointer}
    .primary{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff}
    .secondary{background:#303030;color:var(--text);border:1px solid var(--border)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .hidden{display:none}.events{display:grid;gap:12px;margin-top:12px}
    .event{padding:16px;border:1px solid var(--border);border-radius:16px;background:#1f1f1f;cursor:pointer}
    .event.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(239,95,0,.35) inset}
    .event-title{font-size:18px;font-weight:900;margin-bottom:6px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#303030;border:1px solid var(--border);color:var(--muted);font-size:12px;margin:3px 4px 3px 0}.small{font-size:12px;color:var(--muted)}.error{color:var(--danger);margin-top:10px}.ok{color:#8dff9f;margin-top:10px}.progress{color:var(--muted);font-size:13px;margin-bottom:12px}.checkbox{display:flex;gap:10px;align-items:center;margin-top:10px}.checkbox input{width:auto}.empty{border:1px dashed var(--border);border-radius:16px;padding:14px;margin-top:12px;color:var(--muted);background:#202020}
  </style>
</head>
<body><div class="wrap"><div class="card">
  <div class="progress" id="progress">Step 1/3</div>
  <section id="stepIntro"><h1 id="title"></h1><p id="intro"></p><button class="primary" id="startBtn"></button></section>
  <section id="stepProfile" class="hidden"><h1 id="profileTitle"></h1><label id="nameLabel"></label><input id="name" autocomplete="name"/><div class="row"><div><label id="genderLabel"></label><select id="gender"><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></div><div id="ageBox"><label id="ageLabel"></label><input id="age" type="number" min="1" max="100"/></div></div><label id="countryLabel"></label><input id="country"/><label id="experienceLabel"></label><input id="experience" placeholder="3 years / 3 года"/><label id="ntrpLabel"></label><input id="ntrp" placeholder="3.5 / 4.0 / 4.5"/><div class="checkbox"><input type="checkbox" id="ntrpUnknown"><span id="ntrpUnknownText"></span></div><label id="whatsappLabel"></label><input id="whatsapp" inputmode="tel"/><label id="notesLabel"></label><textarea id="notes"></textarea><p class="small" id="divisionNote"></p><button class="primary" id="nextEventBtn"></button></section>
  <section id="stepEvent" class="hidden"><h1 id="eventTitle"></h1><p id="eventHint"></p><div class="events" id="events"></div><button class="primary" id="submitBtn"></button><button class="secondary" id="backBtn"></button><div id="msg"></div></section>
  <section id="stepDone" class="hidden"><h1 id="doneTitle"></h1><p id="doneText"></p><button class="primary" id="closeBtn"></button></section>
</div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.expand();tg.ready()}const initData=tg?.initData||'';let lang='en',selectedEvent='',events=[];const L={
ru:{progressIntro:'Шаг 1/3',progressProfile:'Шаг 2/3',progressEvent:'Шаг 3/3',title:'Анкета Phuket Tennis Family 🎾',intro:'Заполните короткую анкету игрока. После этого ваш профиль будет в системе PTF, и вы сможете подаваться в открытые события: лигу, турниры и будущие игровые форматы. Если сейчас нет активного события, анкету всё равно можно сохранить в waitlist.',start:'Начать анкету',profileTitle:'Анкета игрока',name:'Имя и фамилия',gender:'Пол',age:'Возраст',country:'Страна',experience:'Опыт игры',ntrp:'Примерный NTRP',ntrpUnknown:'Я не знаю свой уровень',whatsapp:'WhatsApp',notes:'Комментарий / пожелания',divisionNote:'При первом участии дивизион назначает организатор на основе вашего уровня, опыта и текущего состава игроков.',next:'Далее',eventTitle:'Выберите событие',eventHint:'Вы можете выбрать активное событие или просто сохранить анкету в системе PTF. Количество мест в сезоне ограничено, приоритет получают игроки с опытом участия в системе.',submit:'Отправить анкету',back:'Назад',doneTitle:'Анкета отправлена ✅',doneText:'Ваша анкета сохранена в системе PTF. Когда будут открыты подходящие события, вы сможете податься на участие.',doneTextPay:'Заявка отправлена. Вернитесь в Telegram — бот отправил варианты оплаты.',close:'Закрыть',requiredBase:'Пожалуйста, заполните: ',noEvents:'Сейчас нет активных событий. Анкета будет сохранена в waitlist PTF.',profileOnly:'Без события: сохранить анкету в waitlist',startDate:'Старт',fee:'Стоимость',status:'Статус',applications:'Заявок',limited:'Limited spots',open:'Регистрация открыта'},
en:{progressIntro:'Step 1/3',progressProfile:'Step 2/3',progressEvent:'Step 3/3',title:'Phuket Tennis Family Profile 🎾',intro:'Complete a short player profile. Your profile will be saved in the PTF system, and you will be able to join open events: league seasons, tournaments and future playing formats. If there is no active event right now, you can still save your profile to the waitlist.',start:'Start profile',profileTitle:'Player profile',name:'Full name',gender:'Gender',age:'Age',country:'Country',experience:'Tennis experience',ntrp:'Approximate NTRP',ntrpUnknown:'I don’t know my level',whatsapp:'WhatsApp',notes:'Comment / notes',divisionNote:'For first-time participants, the division is assigned by the organizer based on your level, experience and the current player pool.',next:'Next',eventTitle:'Choose event',eventHint:'You can choose an active event or simply save your profile in the PTF system. Season spots are limited, and priority is given to players with experience in the system.',submit:'Submit profile',back:'Back',doneTitle:'Profile sent ✅',doneText:'Your profile has been saved in the PTF system. When suitable events are open, you will be able to join them.',doneTextPay:'Application sent. Return to Telegram — the bot has sent payment options.',close:'Close',requiredBase:'Please fill: ',noEvents:'There are no active events right now. Your profile will be saved to the PTF waitlist.',profileOnly:'No event: save profile to waitlist',startDate:'Start',fee:'Fee',status:'Status',applications:'Applications',limited:'Limited spots',open:'Registration open'}};
const $=id=>document.getElementById(id);function show(id){['stepIntro','stepProfile','stepEvent','stepDone'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function applyLang(){const x=L[lang];$('progress').textContent=x.progressIntro;$('title').textContent=x.title;$('intro').textContent=x.intro;$('startBtn').textContent=x.start;$('profileTitle').textContent=x.profileTitle;$('nameLabel').textContent=x.name;$('genderLabel').textContent=x.gender;$('ageLabel').textContent=x.age;$('countryLabel').textContent=x.country;$('experienceLabel').textContent=x.experience;$('ntrpLabel').textContent=x.ntrp;$('ntrpUnknownText').textContent=x.ntrpUnknown;$('whatsappLabel').textContent=x.whatsapp;$('notesLabel').textContent=x.notes;$('divisionNote').textContent=x.divisionNote;$('nextEventBtn').textContent=x.next;$('eventTitle').textContent=x.eventTitle;$('eventHint').textContent=x.eventHint;$('submitBtn').textContent=x.submit;$('backBtn').textContent=x.back;$('doneTitle').textContent=x.doneTitle;$('doneText').textContent=x.doneText;$('closeBtn').textContent=x.close}
function renderEvents(){const box=$('events');box.innerHTML='';const x=L[lang];const profileOnly=document.createElement('div');profileOnly.className='event'+(selectedEvent===''?' active':'');profileOnly.innerHTML=`<div class="event-title">${x.profileOnly}</div><div class="small">${x.noEvents}</div>`;profileOnly.onclick=()=>{selectedEvent='';renderEvents()};box.appendChild(profileOnly);events.forEach(ev=>{const name=lang==='ru'?(ev.event_name_ru||ev.event_name_en):(ev.event_name_en||ev.event_name_ru);const desc=lang==='ru'?(ev.description_ru||ev.description_en):(ev.description_en||ev.description_ru);const start=ev.start_date||'';const price=ev.price_thb||'';const currency=ev.currency||'THB';const count=ev.applications_count||0;const div=document.createElement('div');div.className='event'+(selectedEvent===ev.event_id?' active':'');div.innerHTML=`<div class="event-title">${name}</div><div class="small">${desc||''}</div><div style="margin-top:10px"><span class="pill">${x.status}: ${x.open}</span><span class="pill">${x.limited}</span>${start?`<span class="pill">${x.startDate}: ${start}</span>`:''}<span class="pill">${x.applications}: ${count}</span></div>${price?`<p><b>${x.fee}: ${price} ${currency}</b></p>`:''}`;div.onclick=()=>{selectedEvent=ev.event_id;renderEvents()};box.appendChild(div)})}
async function bootstrap(){try{const r=await fetch('/api/bootstrap?initData='+encodeURIComponent(initData));const j=await r.json();if(!j.ok)throw new Error(j.error||'Bootstrap error');lang=j.lang||'en';events=j.events||[];const u=j.user||{};$('name').value=[u.first_name,u.last_name].filter(Boolean).join(' ');applyLang();renderEvents()}catch(e){applyLang();$('events').innerHTML=`<p class="error">${e.message}</p>`}}
$('startBtn').onclick=()=>{$('progress').textContent=L[lang].progressProfile;show('stepProfile')};$('nextEventBtn').onclick=()=>{$('progress').textContent=L[lang].progressEvent;show('stepEvent');renderEvents()};$('backBtn').onclick=()=>{$('progress').textContent=L[lang].progressProfile;show('stepProfile')};$('gender').onchange=()=>{$('ageBox').style.display=$('gender').value==='female'?'none':'block'};$('ntrpUnknown').onchange=()=>{$('ntrp').disabled=$('ntrpUnknown').checked;if($('ntrpUnknown').checked)$('ntrp').value=''};
$('submitBtn').onclick=async()=>{$('msg').innerHTML='';$('msg').className='';const profile={name:$('name').value.trim(),gender:$('gender').value,age:$('age').value.trim(),country_of_origin:$('country').value.trim(),experience:$('experience').value.trim(),ntrp:$('ntrp').value.trim(),ntrp_unknown:$('ntrpUnknown').checked,whatsapp:$('whatsapp').value.trim(),notes:$('notes').value.trim()};const missing=[];if(!profile.name)missing.push(L[lang].name);if(!profile.gender)missing.push(L[lang].gender);if(!profile.country_of_origin)missing.push(L[lang].country);if(!profile.experience)missing.push(L[lang].experience);if(!profile.whatsapp)missing.push(L[lang].whatsapp);if(missing.length){$('msg').className='error';$('msg').textContent=L[lang].requiredBase+missing.join(', ');return}$('submitBtn').disabled=true;$('submitBtn').textContent='...';try{const r=await fetch('/api/submit-application',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,profile,event_id:selectedEvent||''})});const j=await r.json();if(!j.ok)throw new Error(j.error||'Error');$('doneText').textContent=j.payment_required?L[lang].doneTextPay:L[lang].doneText;show('stepDone');if(tg)tg.HapticFeedback?.notificationOccurred('success')}catch(e){$('msg').className='error';$('msg').textContent=e.message;$('submitBtn').disabled=false;$('submitBtn').textContent=L[lang].submit}};$('closeBtn').onclick=()=>tg?tg.close():null;bootstrap();
</script></body></html>
