const $=id=>document.getElementById(id);
function show(id){['stepIntro','stepProfile','stepEvent','stepDone'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(v){return String(v||'').trim().toLowerCase()}
function isNo(v){return ['no','false','0','off','hidden','inactive','нет'].includes(norm(v))}
function pick(ev,base){return lang==='ru'?(ev[base+'_ru']||ev[base+'_en']||ev[base]||''):(ev[base+'_en']||ev[base+'_ru']||ev[base]||'')}
function splitBadges(text){return String(text||'').split(/\s*[|\n]\s*/).map(s=>s.trim()).filter(Boolean)}
function formatDate(v){if(!v)return '';const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v);return d.toLocaleDateString(lang==='ru'?'ru-RU':'en-US',{day:'numeric',month:'short',year:'numeric'})}
function statusLabel(ev,status){const custom=pick(ev,'status_label');if(custom)return custom; if(status==='live')return L[lang].live; return L[lang].open}
function showPrice(ev){return Number(ev.price_thb||0)>0 && !isNo(ev.show_price)}
function eventName(ev){return lang==='ru'?(ev.event_name_ru||ev.event_name_en||ev.event_name||ev.name):(ev.event_name_en||ev.event_name_ru||ev.event_name||ev.name)}
function eventDesc(ev){return lang==='ru'?(ev.description_ru||ev.description_en||ev.description||''):(ev.description_en||ev.description_ru||ev.description||'')}
function eventPriceUsdt(ev){return ev.price_usdt || ev.usdt_amount || ev.price_usd || ''}
function eventBadges(ev,status){
  // Single source of truth: every visible badge comes from the Events row.
  // If card_badges_ru/en is filled, show it exactly; otherwise build badges from core Events columns.
  const custom=splitBadges(pick(ev,'card_badges'));
  if(custom.length) return custom.map(t=>`<span class="pill">${esc(t)}</span>`).join('');
  const badges=[];
  badges.push({text:statusLabel(ev,status), cls:status==='live'?'live':'open'});
  const startLabel=pick(ev,'start_label');
  if(startLabel) badges.push({text:startLabel});
  else if(ev.start_date) badges.push({text:`${L[lang].start}: ${formatDate(ev.start_date)}`});
  const endLabel=pick(ev,'end_label');
  if(endLabel) badges.push({text:endLabel});
  else if(ev.end_date) badges.push({text:`${L[lang].end}: ${formatDate(ev.end_date)}`});
  const duration=pick(ev,'duration_label'); if(duration) badges.push({text:duration});
  const venue=pick(ev,'venue'); if(venue) badges.push({text:venue});
  if(ev.registration_deadline) badges.push({text:`${L[lang].deadline}: ${formatDate(ev.registration_deadline)}`});
  if(showPrice(ev)){
    const usdt=Number(eventPriceUsdt(ev)||0)>0?` / ${eventPriceUsdt(ev)} USDT`:'';
    badges.push({text:`${ev.price_thb} ${ev.currency||'THB'}${usdt}`, cls:'price'});
  }
  return badges.map(b=>`<span class="pill ${b.cls||''}">${esc(b.text)}</span>`).join('')
}
function eventPriceHtml(ev){
  if(!showPrice(ev)) return '';
  const usdt=Number(eventPriceUsdt(ev)||0)>0?` / ${esc(eventPriceUsdt(ev))} USDT`:'';
  return `<div class="event-price">${esc(L[lang].price)}: ${esc(ev.price_thb)} ${esc(ev.currency||'THB')}${usdt}</div>`;
}

    {w:1,q:'Forehand and backhand',o:[['1','I am still learning to make contact'],['2','One stroke is much stronger than the other'],['3','Both strokes work but break down under pressure'],['4','Both strokes are stable and I can change direction and pace']]},
    {w:1,q:'Serve',o:[['1','My serve is inconsistent'],['2','My second serve usually goes in but is weak'],['3','I have first/second serve and basic direction'],['4','My serve gives me an advantage or helps me start attacks']]},
    {w:1,q:'Return of serve',o:[['1','I often cannot return the serve into court'],['2','I return slow serves but struggle against strong serves'],['3','I consistently return most amateur serves'],['4','I can return deep / with direction / attack weak serves']]},
    {w:1,q:'Tactics and point construction',o:[['1','I mainly try to return the ball'],['2','I can sometimes play to the opponent’s weaker side'],['3','I build points consciously: direction, depth, weaker side'],['4','I can change pace, spin, direction and use a match plan']]},
    {w:1,q:'What level of opponents feels comfortable for you?',o:[['1','Beginners'],['2','Beginner amateurs'],['3','Intermediate amateurs'],['4','Strong amateurs / tournament players']]}
  ]
};
function ratingFromAverage(avg){
  const raw=2+(avg-1)*(2.5/3);
  const clamped=Math.max(2,Math.min(4.5,raw));
  return (Math.round(clamped*4)/4).toFixed(2).replace(/\.00$/,'.0').replace(/(\.\d)0$/,'$1');
}
function renderRatingTest(){const wrap=$('ratingQuestions');if(!wrap)return;wrap.innerHTML='';(ratingQuestions[lang]||ratingQuestions.en).forEach((item,i)=>{const div=document.createElement('div');div.className='test-q';const opts=['<option value=""></option>'].concat(item.o.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`)).join('');div.innerHTML=`<label>${esc(item.q)}</label><select class="rating-q" data-i="${i}">${opts}</select>`;wrap.appendChild(div)});}
function calculateRating(){const selects=[...document.querySelectorAll('.rating-q')];const items=ratingQuestions[lang]||ratingQuestions.en;if(selects.length<items.length)return '';let sum=0,weight=0;for(let i=0;i<items.length;i++){const v=Number(selects[i]?.value||0);if(!v)return '';const w=Number(items[i].w||1);sum+=v*w;weight+=w;}return ratingFromAverage(sum/weight);}
function updateRatingFromTest(){const rating=calculateRating();if(!rating){$('ratingResult').textContent=L[lang].ratingTestRequired;return ''}$('ntrp').value=rating;$('ratingResult').textContent=L[lang].ratingResult+rating;return rating;}
function applyLang(){const x=L[lang];$('progress').textContent=x.progressIntro;$('title').textContent=mode==='event'?x.titleEvent:(mode==='rating'?x.ratingUpdateTitle:x.titleProfile);$('intro').textContent=mode==='event'?(profileCompleted?x.alreadyProfile:x.introEvent):(mode==='rating'?x.ratingUpdateIntro:x.introProfile);$('startBtn').textContent=mode==='event'?x.startEvent:(mode==='rating'?x.ratingSave:x.startProfile);$('progress2').textContent=mode==='rating'?'':x.progressProfile;$('progress3').textContent=x.progressEvent;$('profileTitle').textContent=mode==='rating'?x.ratingUpdateTitle:x.profileTitle;$('nameLabel').textContent=x.name;$('genderLabel').textContent=x.gender;$('ageLabel').textContent=x.age;$('countryLabel').textContent=x.country;$('experienceLabel').textContent=x.experience;$('ntrpLabel').textContent=x.ntrp;$('ntrpUnknownText').textContent=x.ntrpUnknown;$('whatsappLabel').textContent=x.whatsapp;$('notesLabel').textContent=x.notes;$('divisionNote').textContent=x.divisionNote;$('nextEventBtn').textContent=mode==='rating'?x.ratingSave:x.next;$('backIntroBtn').textContent=x.back;$('eventTitle').textContent=x.eventTitle;$('eventHint').textContent=mode==='event'?(profileCompleted?x.eventHintFound:x.eventHintEvent):x.eventHintProfile;$('submitBtn').textContent=x.submit;$('backBtn').textContent=x.back;$('doneTitle').textContent=x.doneTitle;$('doneText').textContent=x.doneText;$('closeBtn').textContent=x.close;$('playersCloseBtn').textContent=x.closePlayers;$('ratingTestIntro').textContent=x.ratingTestIntro;$('calcRatingBtn').textContent=x.ratingCalc;$('participantsTitle').textContent=x.participantsTitle;$('participantsIntro').textContent=x.participantsIntro;$('participantsBackBtn').textContent=x.participantsBack;renderRatingTest();applyRatingOnlyMode()}
function setDisplay(id, display){const el=$(id); if(el) el.style.display=display}
function applyRatingOnlyMode(){const only=mode==='rating';['nameLabel','name','genderLabel','gender','ageWrap','countryLabel','country','experienceLabel','experience','whatsappLabel','whatsapp','notesLabel','notes','divisionNote'].forEach(id=>setDisplay(id, only?'none':'')); if(only){$('ntrpUnknown').checked=true;$('ratingTest').classList.remove('hidden');renderRatingTest();}}
function renderEvents(){const box=$('events');box.innerHTML='';$('playersPanel').classList.add('hidden');const x=L[lang];if(mode!=='event'){const profileOnly=document.createElement('div');profileOnly.className='event'+(selectedEvent===''?' active':'');profileOnly.innerHTML=`<div class="event-title">${esc(x.profileOnly)}</div><div class="small">${esc(x.profileOnlyText)}</div>`;profileOnly.onclick=()=>{selectedEvent='';renderEvents()};box.appendChild(profileOnly)}
  if(!events.length){const empty=document.createElement('p');empty.className='small';empty.textContent=x.noEvents;box.appendChild(empty)}
  events.forEach(ev=>{const name=eventName(ev);const desc=eventDesc(ev);const status=norm(ev.status||'active');const selectable=!isNo(ev.selectable)&&status!=='live';const div=document.createElement('div');div.className='event'+(selectedEvent===ev.event_id?' active':'')+(selectable?'':' muted');const price=eventPriceHtml(ev);const count=Number(ev.applications_count||ev.players_count||0);const stats=`<div class="statline">${esc(x.applications)}: ${esc(count)}</div>`;div.innerHTML=`<div class="event-title">${esc(name)}</div><div class="small">${esc(desc||'')}</div><div style="margin-top:10px">${eventBadges(ev,status)}</div>${price}${stats}<div class="event-actions"><button type="button" class="inline-btn" data-event-id="${esc(ev.event_id)}">${esc(x.viewPlayers)}</button></div>`;div.onclick=()=>{if(!selectable)return;selectedEvent=ev.event_id;renderEvents()};div.querySelector('button[data-event-id]').onclick=(e)=>{e.stopPropagation();openPlayers(ev)};box.appendChild(div)})}
function playerCard(p){const x=L[lang];const meta=[];if(p.division)meta.push(`<span class="pill">${esc(x.division)}: ${esc(p.division)}</span>`);if(p.rating)meta.push(`<span class="pill">${esc(x.rating)}: ${esc(p.rating)}</span>`);if(p.status)meta.push(`<span class="pill">${esc(x.playerStatus)}: ${esc(p.status)}</span>`);if(p.country)meta.push(`<span class="pill">${esc(x.countryShort)}: ${esc(p.country)}</span>`);const used=new Set(['name','player','player_name','имя','имя_фамилия','фио','участник','игрок','division','дивизион','group','группа','ntrp','ntrp_raketo','raketo','rating','рейтинг','рейтинг_ntrp','status','статус','country','country_of_origin','страна']);const fields=(p.fields||[]).filter(f=>f.value&& !used.has(String(f.key||'').toLowerCase())).map(f=>`<div class="field"><b>${esc(f.label)}</b><span>${esc(f.value)}</span></div>`).join('');return `<div class="participant-card"><div class="participant-head">${esc(p.n||'')}. ${esc(p.name||'')}</div><div class="participant-meta">${meta.join('')}</div>${fields?`<details class="details"><summary>${esc(x.participantsDetails)}</summary>${fields}</details>`:''}</div>`}
async function openPlayers(ev){const x=L[lang];$('playersPanel').classList.remove('hidden');$('playersTitle').textContent=x.playersTitle;const name=eventName(ev);$('playersMeta').textContent=`${name} — ${x.playersLoading}`;$('playersList').innerHTML='';try{const r=await fetch('/api/event-players?event_id='+encodeURIComponent(ev.event_id)+'&initData='+encodeURIComponent(initData));const j=await r.json();if(!j.ok)throw new Error(j.error||'Players loading error');$('playersMeta').textContent=`${name} — ${x.playersCount}: ${j.total||0}`;if(!j.players?.length){$('playersList').innerHTML=`<li>${esc(x.playersEmpty)}</li>`;return}$('playersList').innerHTML=j.players.map(p=>`<li>${esc(p.name)}${p.division?' — '+esc(p.division):''}${p.rating?' — '+esc(p.rating):''}</li>`).join('')}catch(e){$('playersMeta').textContent=e.message}}
async function renderParticipantsPage(){const x=L[lang];$('participantsList').innerHTML=`<p class="small">${esc(x.participantsLoading)}</p>`;try{const r=await fetch('/api/participants?initData='+encodeURIComponent(initData));const j=await r.json();if(!j.ok)throw new Error(j.error||'Participants loading error');if(!j.players?.length){$('participantsList').innerHTML=`<p class="small">${esc(x.participantsEmpty)}</p>`;return}$('participantsList').innerHTML=`<div class="statline">${esc(x.participantsTotal)}: ${esc(j.total||j.players.length)}</div>`+j.players.map(playerCard).join('')}catch(e){$('participantsList').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
async function bootstrap(){try{const r=await fetch('/api/bootstrap?initData='+encodeURIComponent(initData));const j=await r.json();if(!j.ok)throw new Error(j.error||'Bootstrap error');lang=j.lang||'en';events=j.events||[];existingProfile=j.existingProfile||null;profileCompleted=Boolean(j.profileCompleted);const u=j.user||{};$('name').value=[u.first_name,u.last_name].filter(Boolean).join(' ');if(existingProfile)fillProfile(existingProfile);if(mode==='participants'){applyLang();show('stepParticipants');renderParticipantsPage();return}if(mode==='rating'){applyLang();show('stepProfile');return}if(mode==='profile'&&profileCompleted){mode='event';applyLang();renderEvents();show('stepEvent');return}applyLang();renderEvents()}catch(e){applyLang();$('events').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
function profileFromForm(){let rating=$('ntrp').value.trim();if($('ntrpUnknown').checked){rating=calculateRating()||rating}return {name:$('name').value.trim(),gender:$('gender').value,age:$('age').value.trim(),country_of_origin:$('country').value.trim(),experience:$('experience').value.trim(),ntrp:rating,ntrp_unknown:false,racket_rating:rating,whatsapp:$('whatsapp').value.trim(),notes:$('notes').value.trim()}}
function validateProfile(profile){const missing=[];if(!profile.name)missing.push(L[lang].name);if(!profile.gender)missing.push(L[lang].gender);if(!profile.country_of_origin)missing.push(L[lang].country);if(!profile.experience)missing.push(L[lang].experience);if(!profile.ntrp || ['unknown','не знаю','n/a','na','-'].includes(String(profile.ntrp).trim().toLowerCase()))missing.push(L[lang].ntrp);if(!profile.whatsapp)missing.push(L[lang].whatsapp);return missing}
async function saveProfileAndContinue(){const p=profileFromForm();if(mode==='rating'){if(!p.ntrp){$('profileMsg').className='error';$('profileMsg').textContent=L[lang].ratingTestRequired;return}try{const r=await fetch('/api/update-rating',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,rating:p.ntrp})});const j=await r.json();if(!j.ok)throw new Error(j.error||'Save error');$('doneTitle').textContent=L[lang].doneTitle;$('doneText').textContent=L[lang].ratingSaved;$('doneActionBtn').classList.add('hidden');show('stepDone')}catch(e){$('profileMsg').className='error';$('profileMsg').textContent=e.message}return}const missing=validateProfile(p);if(missing.length){$('profileMsg').className='error';$('profileMsg').textContent=L[lang].requiredBase+missing.join(', ');return}try{const r=await fetch('/api/save-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,profile:p})});const j=await r.json();if(!j.ok)throw new Error(j.error||'Save error');profileSaved=true;profileCompleted=true;existingProfile=j.applicant||existingProfile;$('profileMsg').className='ok';$('profileMsg').textContent=L[lang].profileSaved;renderEvents();show('stepEvent')}catch(e){$('profileMsg').className='error';$('profileMsg').textContent=e.message}}
async function submitApplication(){const p=profileFromForm();if(!profileCompleted&&!profileSaved){const missing=validateProfile(p);if(missing.length){$('msg').className='error';$('msg').textContent=L[lang].requiredBase+missing.join(', ');return}}if(mode==='event'&&!selectedEvent){$('msg').className='error';$('msg').textContent=lang==='ru'?'Пожалуйста, выберите событие.':'Please choose an event.';return}try{$('msg').textContent='';const r=await fetch('/api/submit-application',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,profile:p,event_id:selectedEvent,mode})});const j=await r.json();if(!j.ok)throw new Error(j.error||'Submit error');
    if(selectedEvent && j.payment_required){
      $('doneTitle').textContent=lang==='ru'?'Оплата участия':'Payment required';
      $('doneText').textContent=lang==='ru'?'Заявка на событие сохранена. Следующий шаг — оплата участия. Вернитесь в чат Telegram-бота и выберите способ оплаты. Неоплаченная заявка не является активным участием. Оплаченные заявки будут рассматриваться в первую очередь.':'Your event application has been saved. Next step — participation payment. Return to the Telegram bot chat and choose a payment method. An unpaid application is not an active entry. Paid applications will be processed first.';
    } else {
      $('doneTitle').textContent=L[lang].doneTitle;
      $('doneText').textContent=selectedEvent?L[lang].doneTextEvent:(lang==='ru'?'Анкета сохранена в системе PTF. Теперь вы можете подать заявку в открытое событие.':'Your profile has been saved in the PTF system. You can now join an open event.');
    }
    $('doneActionBtn').textContent=L[lang].joinEventNow;
    $('doneActionBtn').classList.toggle('hidden', Boolean(selectedEvent));
    show('stepDone')}catch(e){$('msg').className='error';$('msg').textContent=e.message}}
$('gender').onchange=()=>{$('ageWrap').style.display=$('gender').value==='female'?'none':'block'};
$('ntrpUnknown').onchange=()=>{$('ratingTest').classList.toggle('hidden',!$('ntrpUnknown').checked);if($('ntrpUnknown').checked){$('ntrp').value='';renderRatingTest();}};
$('calcRatingBtn').onclick=updateRatingFromTest;
$('startBtn').onclick=()=>{if(mode==='rating'){show('stepProfile');applyRatingOnlyMode()}else if(profileCompleted){mode='event';applyLang();show('stepEvent');renderEvents()}else show('stepProfile')};
$('nextEventBtn').onclick=saveProfileAndContinue;
$('submitBtn').onclick=submitApplication;
$('backBtn').onclick=()=>{if(mode==='event')show('stepIntro');else show('stepProfile')};
$('backIntroBtn').onclick=()=>show('stepIntro');
$('doneActionBtn').onclick=()=>{selectedEvent='';mode='event';show('stepEvent');renderEvents()};
$('closeBtn').onclick=()=>{if(tg)tg.close();else location.href='/'};
$('playersCloseBtn').onclick=()=>$('playersPanel').classList.add('hidden');
$('participantsBackBtn').onclick=()=>{if(tg)tg.close();else location.href='/'};
bootstrap();
</script>
