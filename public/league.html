<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PTF League</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#141414;--card:#202020;--card2:#292929;--text:#f6f4ef;--muted:#a9a49b;--accent:#ef5f00;--accent2:#ff8a2a;--border:#3a3a3a;--win:#19c37d;--lose:#ff6b6b;--gold:#e8b93a}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#0f0f0f,#1b1b1b);color:var(--text);min-height:100vh;padding:0 14px 40px}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:22px;margin:14px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 0 8px;background:linear-gradient(180deg,#101010 78%,rgba(16,16,16,0));margin-bottom:4px}
.tab{text-align:center;padding:9px 4px;border-radius:11px;background:var(--card2);border:1.5px solid var(--border);font-size:11.5px;font-weight:800;cursor:pointer;user-select:none;opacity:.55;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{opacity:1;border-color:var(--accent);background:rgba(239,95,0,.14)}
.hidden{display:none}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 10px;line-height:1.5}

/* поиск и фильтры */
.search{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--border);background:var(--card2);color:var(--text);font-size:15px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{padding:8px 13px;border-radius:11px;background:var(--card2);border:1.5px solid var(--border);font-size:12.5px;font-weight:800;cursor:pointer;user-select:none;opacity:.6}
.chip.on{opacity:1;border-color:var(--accent);background:rgba(239,95,0,.14);color:#ffd2a8}

/* годовая гонка */
.rank{display:grid;grid-template-columns:30px 38px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--border);margin-bottom:8px;cursor:pointer}
.rank.top{border-color:rgba(232,185,58,.5);background:linear-gradient(90deg,rgba(232,185,58,.10),var(--card) 60%)}
.rank .pos{font-size:15px;font-weight:900;text-align:center;color:var(--muted)}
.rank.top .pos{color:var(--gold)}
.rank .nm{font-size:14.5px;font-weight:800;line-height:1.25;min-width:0}
.rank .sub2{color:var(--muted);font-size:11.5px;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pts{text-align:right}
.pts b{font-size:17px;font-weight:900;color:var(--accent2);display:block;line-height:1.1}
.pts span{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#333;border:1px solid #444;flex:0 0 38px}
.avph{width:38px;height:38px;border-radius:50%;background:#333;border:1px solid #444;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#8f8a82}

/* бейджи */
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;border:1px solid var(--border);background:#303030;color:var(--muted);white-space:nowrap}
.badge.div{background:rgba(239,95,0,.16);border-color:var(--accent);color:#ffd2a8}
.badge.act{background:rgba(25,195,125,.15);border-color:#0f7a4f;color:#b7f3d8}
.badge.gold{background:rgba(232,185,58,.15);border-color:var(--gold);color:#f4e2a8}

/* форма W/L */
.form{display:flex;gap:4px}
.fm{width:17px;height:17px;border-radius:5px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#111}
.fm.w{background:var(--win)}
.fm.l{background:var(--lose)}

/* список игроков сеткой */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer}
.pcard .ph{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#2a2a2a}
.pcard .phh{width:100%;aspect-ratio:1/1;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#4d4a45}
.pcard .body{padding:10px 11px 12px}
.pcard .body .nm{font-size:13.5px;font-weight:800;line-height:1.25}
.pcard .body .row{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}

/* карточка игрока */
.hero{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;margin-bottom:12px}
.hero img{width:100%;max-height:330px;object-fit:cover;display:block;background:#2a2a2a}
.hero .heroph{width:100%;height:220px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:#4d4a45}
.hero .info{padding:14px 15px 16px}
.hero h2{margin:0 0 8px;font-size:21px;line-height:1.2}
.hero .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--card2);border:1px solid var(--border);border-radius:13px;padding:9px 11px}
.stat .k{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:16px;font-weight:900;margin-top:2px}
.stat .v.acc{color:var(--accent2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13.5px}
.line:last-child{border-bottom:0}
.line .k{color:var(--muted)}
button{width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:900;margin-top:12px;cursor:pointer;background:var(--card2);color:var(--text);border:1px solid var(--border)}
.count{color:var(--muted);font-size:12px;margin:0 0 10px}
/* карточка матча */
.mt{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:11px;margin-bottom:9px}
.mt .top{text-align:center;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:8px}
.mt .body{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.mt .oav{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#333;border:1px solid #444}
.mt .oavh{width:44px;height:44px;border-radius:50%;background:#333;border:1px solid #444;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#8f8a82}
.mt .who{font-size:13.5px;font-weight:800;line-height:1.25}
.mt .sc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:900;color:var(--accent2);margin-top:3px}
.mt .rs{font-size:10.5px;font-weight:900;padding:3px 9px;border-radius:999px;white-space:nowrap}
.mt .rs.w{background:rgba(25,195,125,.16);color:#b7f3d8;border:1px solid #0f7a4f}
.mt .rs.l{background:rgba(255,107,107,.14);color:#ffc9c9;border:1px solid #7a2f2f}
.more{width:100%;border:1px dashed var(--border);background:transparent;color:var(--muted);border-radius:12px;padding:11px;font-size:13px;font-weight:800;cursor:pointer;margin-top:2px}
.season{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.season:last-child{border-bottom:0}
.season .sh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.season .sn{font-size:14px;font-weight:800}
.season .sp{font-size:13px;font-weight:900;color:var(--accent2);white-space:nowrap}
.season .sd{color:var(--muted);font-size:12px;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* турнирная таблица */
.tbl{margin:0 -4px}
.tbl .tr{display:grid;grid-template-columns:20px minmax(0,1fr) 24px 24px 32px 74px;gap:5px;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px;cursor:pointer}
.tbl.ext .tr{grid-template-columns:20px 1fr 22px 22px 22px 30px 30px 30px 36px;font-size:11.5px;cursor:default}
.tbl .tr.th{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;cursor:default;border-bottom:1px solid var(--border)}
.tbl .tr>span{text-align:center;overflow:hidden}
.tbl .tr .pl{font-weight:900}
.tbl .tr .pn{text-align:left;font-weight:800;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .tr .b{font-weight:900;color:var(--accent2)}
.tbl .tr .badge{font-size:9.5px;padding:2px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tbl .tr .pn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .tav{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:0 0 22px;background:#333}
.tbl .z-playoff{background:rgba(25,195,125,.07)}
.tbl .z-relegation{background:rgba(255,107,107,.07)}
/* перекрёстная сетка */
.mx{overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
.mx table{border-collapse:collapse;font-size:10.5px;white-space:nowrap}
.mx th,.mx td{border:1px solid var(--border);padding:5px 7px;text-align:center;color:var(--muted)}
.mx th{background:var(--card2);color:var(--text);font-weight:800;position:sticky;top:0}
.mx td.rowh,.mx th:first-child{background:var(--card2);color:var(--text);font-weight:800;text-align:left;position:sticky;left:0;z-index:1}
.mx td.self{background:#1c1c1c}
.oav.win{border:2px solid var(--win)}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Лига</h1>
  <p class="sub" id="sub">Загружаем…</p>
  <div class="tabs" id="tabs">
    <div class="tab on" data-t="home">Главная</div>
    <div class="tab" data-t="div">Дивизионы</div>
    <div class="tab" data-t="race">Гонка</div>
    <div class="tab" data-t="players">Игроки</div>
    <div class="tab" data-t="matches">Матчи</div>
    <div class="tab" data-t="events">Турниры</div>
    <div class="tab" data-t="about">О лиге</div>
    <div class="tab" style="opacity:.25;cursor:default" data-t="">Партнёры</div>
  </div>
  <div id="viewHome"></div>
  <div id="viewDiv" class="hidden"></div>
  <div id="viewRace" class="hidden"></div>
  <div id="viewPlayers" class="hidden"></div>
  <div id="viewMatches" class="hidden"></div>
  <div id="viewEvents" class="hidden"></div>
  <div id="viewAbout" class="hidden"></div>
  <div id="viewCard" class="hidden"></div>
</div>
<script>
var tg=window.Telegram&&window.Telegram.WebApp; if(tg){tg.ready();tg.expand();}
var initData=(tg&&tg.initData)||'';
var L=((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code)||'').toLowerCase().indexOf('ru')===0;
var players=[],matches={},events=[],divisions=[],season='',me=null,meDivision='';
var mode='home',openId='',query='',divFilter='',statusFilter='',raceQuery='',raceBucket='',allMatches=false;
var feedQuery='',feedDiv='',feedLimit=20;
var divLetter='',divData=null,divLoading=false,divErr='',showExtended=false,showMatrix=false;
var VIEWS=['home','div','race','players','matches','events','about'];

var T={
  ru:{title:'Лига',race:'Годовая гонка',players:'Игроки',
      sub:'Таблицы, матчи, игроки и годовая гонка PTF.',
      search:'Поиск по имени…',all:'Все',
      pts:'очков',pos:'место',found:'Найдено: ',nobody:'Никого не нашлось — попробуй другое имя.',
      matches:'Матчи',wins:'Победы',losses:'Поражения',winrate:'Win rate',mShort:'матчей',wShort:'побед',
      ntrp:'NTRP',exp:'Опыт',country:'Страна',seasons:'Сезонов',division:'Дивизион',
      form:'Форма',record:'Рекорд',rank:'Место в гонке',points:'Очки гонки',
      titles:'Достижения',history:'Сезоны',back:'⬅️ Назад',site:'🌐 Открыть на сайте',
      mhistory:'История матчей',showAll:'Показать все матчи',showLess:'Свернуть',noMatches:'Матчей пока нет.',
      total:'Все',upper:'Upper A+B',lower:'Lower C+D',prime:'PRIME',place:'место',
      tHome:'Главная',tDiv:'Дивизионы',tRace:'Гонка',tPlayers:'Игроки',tMatches:'Матчи',tEvents:'Турниры',tAbout:'О лиге',tPartners:'Партнёры',
      champions:'Чемпионы сезона',yourSeason:'Твой сезон',yourDiv:'Твой дивизион',notInLeague:'Ты пока не в составе дивизиона. Подай заявку — и раздел оживёт.',
      standings:'Турнирная таблица',extended:'Расширенная статистика',matrix:'Все против всех',playoff:'Плей-офф',champion:'Чемпион',
      final:'Финал',sf1:'Полуфинал 1',sf2:'Полуфинал 2',seed:'Посев',
      colP:'#',colPlayer:'Игрок',colM:'М',colW:'П',colL:'Пор',colPts:'Очки',colZone:'Статус',
      zPlayoff:'Плей-офф',zExtra:'Добор',zRelegation:'Вылет',
      colSW:'СВ',colSL:'СП',colSD:'±С',colGW:'ГВ',colGL:'ГП',colGD:'±Г',colWR:'WR',
      noDiv:'Дивизион пока не сформирован.',pickDiv:'Выбери дивизион',
      allMatchesT:'Все матчи лиги',noEvents:'Турниров пока нет. Появятся здесь, как только заведём первый.',
      rules:'Как считается таблица',statusF:'Статус',anyStatus:'Любой',showMore:'Показать ещё',
      noData:'Данных пока нет.',divpos:'в дивизионе'},
  en:{title:'League',race:'Yearly Race',players:'Players',
      sub:'Standings, matches, players and the yearly race.',
      search:'Search by name…',all:'All',
      pts:'points',pos:'place',found:'Found: ',nobody:'Nobody matched — try another name.',
      matches:'Matches',wins:'Wins',losses:'Losses',winrate:'Win rate',mShort:'played',wShort:'won',
      ntrp:'NTRP',exp:'Experience',country:'Country',seasons:'Seasons',division:'Division',
      form:'Form',record:'Record',rank:'Race place',points:'Race points',
      titles:'Achievements',history:'Seasons',back:'⬅️ Back',site:'🌐 Open on the website',
      mhistory:'Match history',showAll:'Show all matches',showLess:'Collapse',noMatches:'No matches yet.',
      total:'Total',upper:'Upper A+B',lower:'Lower C+D',prime:'PRIME',place:'place',
      tHome:'Home',tDiv:'Divisions',tRace:'Race',tPlayers:'Players',tMatches:'Matches',tEvents:'Events',tAbout:'About',tPartners:'Partners',
      champions:'Season champions',yourSeason:'Your season',yourDiv:'Your division',notInLeague:'You are not in a division yet. Apply and this section comes alive.',
      standings:'Standings',extended:'Extended standings',matrix:'Head-to-head',playoff:'Playoffs',champion:'Champion',
      final:'Final',sf1:'Semifinal 1',sf2:'Semifinal 2',seed:'Seed',
      colP:'#',colPlayer:'Player',colM:'M',colW:'W',colL:'L',colPts:'Pts',colZone:'Status',
      zPlayoff:'Playoff',zExtra:'Extra Draw',zRelegation:'Relegation',
      colSW:'SW',colSL:'SL',colSD:'SD',colGW:'GW',colGL:'GL',colGD:'GD',colWR:'WR',
      noDiv:'This division is not formed yet.',pickDiv:'Pick a division',
      allMatchesT:'All league matches',noEvents:'No tournaments yet. They will appear here once we add the first one.',
      rules:'How the table works',statusF:'Status',anyStatus:'Any',showMore:'Show more',
      noData:'No data yet.',divpos:'in division'}
};
var X=L?T.ru:T.en;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||''}).join('').toUpperCase()}
function openLink(u){if(tg&&tg.openLink)tg.openLink(u);else window.open(u,'_blank')}

function avatar(p,cls){
  return p.photo
    ? '<img class="'+cls+'" src="'+esc(p.photo)+'" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;'+cls+'h&quot;>'+esc(initials(p.name))+'</div>\'">'
    : '<div class="'+cls+'h">'+esc(initials(p.name))+'</div>';
}
function formRow(form){
  if(!form||!form.length)return '';
  return '<span class="form">'+form.map(function(f){return '<span class="fm '+(f==='W'?'w':'l')+'">'+f+'</span>'}).join('')+'</span>';
}
function playerDivisions(){
  var seen={},out=[];
  players.forEach(function(p){var d=(p.division||'').trim();if(d&&!seen[d]){seen[d]=1;out.push(d)}});
  return out.sort();
}

var VIEW_ID={home:'viewHome',div:'viewDiv',race:'viewRace',players:'viewPlayers',matches:'viewMatches',events:'viewEvents',about:'viewAbout'};
function showTab(t){
  if(VIEWS.indexOf(t)<0)return;
  mode=t;openId='';allMatches=false;syncBackButton();
  VIEWS.forEach(function(k){
    var tab=document.querySelector('.tab[data-t="'+k+'"]');if(tab)tab.classList.toggle('on',k===t);
    $(VIEW_ID[k]).classList.toggle('hidden',k!==t);
  });
  $('tabs').classList.remove('hidden');
  $('viewCard').classList.add('hidden');
  if(t==='home')renderHome();
  else if(t==='div')renderDiv();
  else if(t==='race')renderRace();
  else if(t==='players')renderPlayers();
  else if(t==='matches')renderFeed();
  else if(t==='events')renderEvents();
  else renderAbout();
  window.scrollTo(0,0);
}

// --- Годовая гонка -----------------------------------------------------------
// Корзины сезона — те же, что на сайте: Все, Upper A+B, Lower C+D, PRIME.
function inBucket(p,b){
  var d=String(p.division||'').replace(/^division\s*/i,'').trim().toUpperCase();
  if(!b)return true;
  if(b==='upper')return d==='A'||d==='B';
  if(b==='lower')return d==='C'||d==='D';
  if(b==='prime')return d==='PRIME'||d==='P';
  return true;
}
function renderRace(){
  var buckets=[['','total'],['upper','upper'],['lower','lower'],['prime','prime']];
  var chips=buckets.map(function(b){
    return '<div class="chip'+(raceBucket===b[0]?' on':'')+'" onclick="setBucket(\''+b[0]+'\')">'+esc(X[b[1]])+'</div>';
  }).join('');
  // отдельные чипы по дивизионам — появляются сами, когда дивизион есть в данных
  var divChips=playerDivisions().map(function(d){
    return '<div class="chip'+(divFilter===d?' on':'')+'" onclick="setRaceDiv(\''+esc(d)+'\')">'+esc(d)+'</div>';
  }).join('');
  var q=raceQuery.trim().toLowerCase();
  var list=players.filter(function(p){return p.points>0||p.position>0})
    .filter(function(p){return inBucket(p,raceBucket)})
    .filter(function(p){return !divFilter||(p.division||'')===divFilter})
    .filter(function(p){return !q||String(p.name||'').toLowerCase().indexOf(q)>=0})
    .slice().sort(function(a,b){return (a.position||9999)-(b.position||9999)||b.points-a.points});
  var head='<input class="search" id="rq" placeholder="'+esc(X.search)+'" value="'+esc(raceQuery)+'" oninput="setRaceQuery(this.value)">'
    +'<div class="chips">'+chips+'</div>'
    +(divChips?'<div class="chips">'+divChips+'</div>':'')
    +'<div class="count">'+esc(X.found)+list.length+'</div>';
  if(!list.length){$('viewRace').innerHTML=head+'<div class="empty">'+esc(X.nobody)+'</div>';return}
  $('viewRace').innerHTML=head+list.map(function(p,i){
    var place=p.position||i+1;   // место всегда из общей гонки, фильтр его не пересчитывает
    return '<div class="rank'+(place<=3?' top':'')+'" onclick="openCard(\''+esc(p.id)+'\')">'
      +'<div class="pos">'+place+'</div>'
      +avatar(p,'av')
      +'<div style="min-width:0"><div class="nm">'+esc(p.name)+'</div>'
      +'<div class="sub2">'+(p.division?'<span class="badge div">'+esc(p.division)+'</span>':'')
        +'<span>'+p.matches+' '+esc(X.mShort)+' · '+p.wins+' '+esc(X.wShort)+'</span>'
        +(p.win_rate?'<span>'+esc(p.win_rate)+'</span>':'')+'</div></div>'
      +'<div class="pts"><b>'+p.points+'</b><span>'+esc(X.pts)+'</span></div>'
      +'</div>';
  }).join('');
  var el=$('rq');
  if(el&&raceQuery&&document.activeElement!==el){el.focus();el.setSelectionRange(raceQuery.length,raceQuery.length)}
}
function setBucket(b){raceBucket=b;divFilter='';renderRace()}
function setRaceDiv(d){divFilter=(divFilter===d?'':d);renderRace()}
function setRaceQuery(v){raceQuery=v;renderRace()}

// --- Игроки ------------------------------------------------------------------
function renderPlayers(){
  var chips='<div class="chip'+(divFilter===''?' on':'')+'" onclick="setDiv(\'\')">'+esc(X.all)+'</div>'
    +playerDivisions().map(function(d){
      return '<div class="chip'+(divFilter===d?' on':'')+'" onclick="setDiv(\''+esc(d)+'\')">'+esc(d)+'</div>';
    }).join('');
  // Статусы берём из данных, чтобы не хардкодить Active/Waitlist/Waiting.
  var stats={},statList=[];
  players.forEach(function(p){var st=(p.status||'').trim();if(st&&!stats[st]){stats[st]=1;statList.push(st)}});
  var schips='<div class="chip'+(statusFilter===''?' on':'')+'" onclick="setStatus(\'\')">'+esc(X.anyStatus)+'</div>'
    +statList.sort().map(function(st){
      return '<div class="chip'+(statusFilter===st?' on':'')+'" onclick="setStatus(\''+esc(st)+'\')">'+esc(st)+'</div>';
    }).join('');
  var q=query.trim().toLowerCase();
  var list=players.filter(function(p){
    if(divFilter&&(p.division||'')!==divFilter)return false;
    if(statusFilter&&(p.status||'')!==statusFilter)return false;
    if(q&&String(p.name||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var head='<input class="search" id="q" placeholder="'+esc(X.search)+'" value="'+esc(query)+'" oninput="setQuery(this.value)">'
    +'<div class="chips">'+chips+'</div>'
    +'<div class="chips">'+schips+'</div>'
    +'<div class="count">'+esc(X.found)+list.length+'</div>';
  var body=list.length
    ? '<div class="grid">'+list.map(function(p){
        return '<div class="pcard" onclick="openCard(\''+esc(p.id)+'\')">'+avatar(p,'ph')
          +'<div class="body"><div class="nm">'+esc(p.name)+'</div><div class="row">'
          +(p.division?'<span class="badge div">'+esc(p.division)+'</span>':'')
          +(String(p.status||'').toLowerCase()==='active'?'<span class="badge act">Active</span>':'')
          +'</div><div class="row">'+formRow(p.form)+'</div></div></div>';
      }).join('')+'</div>'
    : '<div class="empty">'+esc(X.nobody)+'</div>';
  $('viewPlayers').innerHTML=head+body;
  var el=$('q');
  if(el&&document.activeElement!==el&&query){el.focus();el.setSelectionRange(query.length,query.length)}
}

function openCardByName(name){
  var p=players.filter(function(x){return String(x.name||'').toLowerCase()===String(name).toLowerCase()})[0];
  if(p)openCard(p.id);

function openCard(id){
  var p=players.filter(function(x){return String(x.id)===String(id)})[0];
  if(!p)return;
  openId=id;
  var stat=function(k,v,acc){return v?'<div class="stat"><div class="k">'+esc(k)+'</div><div class="v'+(acc?' acc':'')+'">'+esc(v)+'</div></div>':''};
  var badges='';
  if(p.division)badges+='<span class="badge div">'+esc(X.division)+' '+esc(p.division)+'</span>';
  if(p.position)badges+='<span class="badge gold">'+esc(X.rank)+' #'+p.position+'</span>';
  if(p.division_position)badges+='<span class="badge">#'+esc(p.division_position)+' '+esc(X.divpos)+'</span>';
  if(String(p.status||'').toLowerCase()==='active')badges+='<span class="badge act">Active</span>';
  else if(p.status)badges+='<span class="badge">'+esc(p.status)+'</span>';

  var h='<div class="hero">'
    +(p.photo?'<img src="'+esc(p.photo)+'" alt="">':'<div class="heroph">'+esc(initials(p.name))+'</div>')
    +'<div class="info"><h2>'+esc(p.name)+'</h2>'
    +'<div class="row">'+badges+'</div>'
    +(p.form&&p.form.length?'<div class="row"><span class="badge">'+esc(X.form)+'</span>'+formRow(p.form)+'</div>':'')
    +'<div class="stats">'
      +stat(X.points,p.points||'',true)
      +stat(X.matches,p.matches||'')
      +stat(X.record,(p.wins||0)+'–'+(p.losses||0))
      +stat(X.winrate,p.win_rate||'')
      +stat(X.ntrp,p.ntrp||'')
      +stat(X.exp,p.experience||'')
      +stat(X.country,p.nationality||'')
      +stat(X.seasons,p.seasons||'')
    +'</div></div></div>';

  // История матчей: по умолчанию пять последних, ниже разворот на все.
  var mine=matches[String(p.id)]||[];
  h+='<div class="card"><h3>'+esc(X.mhistory)+(mine.length?' · '+mine.length:'')+'</h3>';
  if(!mine.length)h+='<div class="empty" style="padding:10px 0">'+esc(X.noMatches)+'</div>';
  else{
    var shown=allMatches?mine:mine.slice(0,5);
    h+=shown.map(matchCard).join('');
    if(mine.length>5)h+='<button class="more" onclick="toggleMatches(\''+esc(p.id)+'\')">'+esc(allMatches?X.showLess:X.showAll+' ('+mine.length+')')+'</button>';
  }
  h+='</div>';

  if(p.seasons_list&&p.seasons_list.length){
    h+='<div class="card"><h3>'+esc(X.history)+'</h3>'
      +p.seasons_list.map(function(s){
        var meta=[];
        if(s.division)meta.push('<span class="badge div">Div '+esc(s.division)+'</span>');
        if(s.position)meta.push('<span class="badge gold">'+esc(s.position)+' '+esc(X.place)+'</span>');
        else if(s.regular_finish)meta.push('<span class="badge">'+esc(s.regular_finish)+' '+esc(X.place)+'</span>');
        if(s.playoff)meta.push('<span class="badge">'+esc(s.playoff)+'</span>');
        if(s.promotion)meta.push('<span class="badge act">'+esc(s.promotion)+'</span>');
        (s.titles||[]).forEach(function(t){meta.push('<span class="badge gold">🏆 '+esc(t)+'</span>')});
        return '<div class="season"><div class="sh"><span class="sn">'+esc(s.name||('Season '+s.number))+'</span>'
          +(s.points?'<span class="sp">'+s.points+' '+esc(X.pts)+'</span>':'')+'</div>'
          +(meta.length?'<div class="sd">'+meta.join('')+'</div>':'')+'</div>';
      }).join('')+'</div>';
  }
  // Достижения, уже показанные внутри сезонов, второй раз не повторяем.
  var shownTitles={};
  (p.seasons_list||[]).forEach(function(s){(s.titles||[]).forEach(function(t){shownTitles[t]=1})});
  var rest=(p.titles||[]).map(function(t){return t.type||t.title||''}).filter(function(t){return t&&!shownTitles[t]});
  if(rest.length){
    h+='<div class="card"><h3>'+esc(X.titles)+'</h3>'
      +rest.map(function(t){return '<div class="line"><span>🏆 '+esc(t)+'</span></div>'}).join('')+'</div>';
  }
  if(p.profile_url)h+='<button onclick="openLink(\''+esc(/^https?:/i.test(p.profile_url)?p.profile_url:'https://www.phukettennis.com'+p.profile_url)+'\')">'+esc(X.site)+'</button>';

  $('viewCard').innerHTML=h;
  $('tabs').classList.add('hidden');
  $('viewRace').classList.add('hidden');
  $('viewPlayers').classList.add('hidden');
  $('viewCard').classList.remove('hidden');
  syncBackButton();
  window.scrollTo(0,0);
}

function loadDiv(){

function matrixTable(d){

// --- Лента всех матчей ------------------------------------------------------
// Собираем из той же истории, что и карточки: там по строке на игрока,
// поэтому берём одну сторону пары, чтобы матч не задвоился.
function allMatchesList(){
  var out=[],seen={};
  Object.keys(matches).forEach(function(pid){
    (matches[pid]||[]).forEach(function(m){
      var key=(m.match_no||'')+'-'+[pid,m.opponent_id].sort().join('-');
      if(seen[key])return;seen[key]=1;
      var p=players.filter(function(x){return String(x.id)===String(pid)})[0]||{name:'',photo:''};
      var win=m.result==='WIN';
      out.push({no:m.match_no,date:m.date,competition:m.competition,
        winner:win?{id:pid,name:p.name,photo:p.photo,div:m.division}:{id:m.opponent_id,name:m.opponent,photo:m.opponent_photo,div:m.opponent_division},
        loser:win?{id:m.opponent_id,name:m.opponent,photo:m.opponent_photo,div:m.opponent_division}:{id:pid,name:p.name,photo:p.photo,div:m.division},
        score:win?m.score:reverseScoreText(m.score),division:m.division||m.opponent_division});
    });
  });
  return out.sort(function(a,b){return Number(b.no||0)-Number(a.no||0)});
}
function reverseScoreText(sc){
  return String(sc||'').split('/').map(function(part){
    return part.replace(/(\d+):(\d+)/g,function(_,a,b){return b+':'+a});
  }).join('/');
}
function renderFeed(){

  var chips='<div class="chip'+(feedDiv===''?' on':'')+'" onclick="setFeedDiv(\'\')">'+esc(X.all)+'</div>'
    +divs.map(function(d){return '<div class="chip'+(feedDiv===d?' on':'')+'" onclick="setFeedDiv(\''+d+'\')">'+esc(d)+'</div>'}).join('');
  var q=feedQuery.trim().toLowerCase();
  var shown=list.filter(function(m){
    if(feedDiv&&String(m.division||'').toUpperCase()!==feedDiv)return false;
    if(q&&(String(m.winner.name).toLowerCase().indexOf(q)<0&&String(m.loser.name).toLowerCase().indexOf(q)<0))return false;
    return true;
  });
  var head='<input class="search" id="fq" placeholder="'+esc(X.search)+'" value="'+esc(feedQuery)+'" oninput="setFeedQuery(this.value)">'
    +'<div class="chips">'+chips+'</div><div class="count">'+esc(X.found)+shown.length+'</div>';
  var page=shown.slice(0,feedLimit);
  $('viewMatches').innerHTML=head+(page.length?page.map(feedCard).join(''):'<div class="empty">'+esc(X.nobody)+'</div>')

  var el=$('fq');
  if(el&&feedQuery&&document.activeElement!==el){el.focus();el.setSelectionRange(feedQuery.length,feedQuery.length)}

  var rules=ru
    ? ['Победа — <b>3</b> очка, поражение — <b>1</b>.',
       'При равенстве очков места определяются так: очки → разница сетов → разница геймов → выигранные сеты.',
       'Места <b>1–4</b> — плей-офф, <b>5–6</b> — добор, <b>7–8</b> — вылет.',
       'Тай-брейк в сете отображается в счёте. Чемпионский тай-брейк считается сетом, но не влияет на разницу геймов.',
       'Техническое поражение (W/O): сопернику 3 очка, сеты и геймы не начисляются.']
    : ['A win is <b>3</b> points, a loss is <b>1</b>.',
       'Ties are broken by: points → set difference → game difference → sets won.',
       'Places <b>1–4</b> go to the playoff, <b>5–6</b> to the extra draw, <b>7–8</b> to relegation.',
       'Set tie-breaks show in the score. A match tie-break counts as a set but not towards game difference.',
       'A walkover (W/O) gives the opponent 3 points; no sets or games are added.'];
  $('viewAbout').innerHTML='<div class="card"><h3>'+esc(X.rules)+'</h3>'
    +rules.map(function(r){return '<div class="line"><span>'+r+'</span></div>'}).join('')+'</div>'
    +'<div class="card"><h3>Phuket Tennis Family</h3><div class="hint">'+esc(X.sub)+'</div>'
    +'<button onclick="openLink(\'https://www.phukettennis.com\')">'+esc(X.site)+'</button></div>';
}

function matchCard(m){
  var av=m.opponent_photo
    ? '<img class="oav" src="'+esc(m.opponent_photo)+'" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;oavh&quot;>'+esc(initials(m.opponent))+'</div>\'">'
    : '<div class="oavh">'+esc(initials(m.opponent))+'</div>';
  var top=[m.match_no?'#'+m.match_no:'',m.date,m.competition].filter(Boolean).join(' · ');
  return '<div class="mt"'+(m.opponent_id?' onclick="openCard(\''+esc(m.opponent_id)+'\')" style="cursor:pointer"':'')+'>'
    +(top?'<div class="top">'+esc(top)+'</div>':'')
    +'<div class="body">'+av
    +'<div style="min-width:0"><div class="who">'+esc(m.opponent)+(m.opponent_division?' <span class="badge div">'+esc(m.opponent_division)+'</span>':'')+'</div>'
    +'<div class="sc">'+esc(m.score||'—')+'</div></div>'
    +'<div class="rs '+(m.result==='WIN'?'w':'l')+'">'+esc(m.result)+'</div>'
    +'</div></div>';
}
function toggleMatches(id){allMatches=!allMatches;openCard(id)}

// Штатная стрелка «Назад» в шапке Telegram: на Android на неё же приходит
// аппаратная кнопка. Отдельная кнопка внизу страницы больше не нужна.
function syncBackButton(){
  if(!tg||!tg.BackButton)return;
  if(openId)tg.BackButton.show();else tg.BackButton.hide();
}
if(tg&&tg.BackButton&&tg.BackButton.onClick)tg.BackButton.onClick(function(){ if(openId)showTab(mode); });

document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){if(b.dataset.t)showTab(b.dataset.t)}});

fetch('/api/league/bootstrap?initData='+encodeURIComponent(initData),{cache:'no-store'})
  .then(function(r){return r.json()}).then(function(j){
    if(!j.ok)throw new Error(j.error||'Error');
    if(j.lang){L=j.lang==='ru';X=L?T.ru:T.en}
    players=j.players||[];matches=j.matches||{};events=j.events||[];divisions=j.divisions||[];
    season=j.season||'';me=j.user||null;meDivision=j.me_division||'';
    $('title').textContent=X.title;
    $('sub').textContent=X.sub+(season?' Season '+season+'.':'');
    var labels={home:X.tHome,div:X.tDiv,race:X.tRace,players:X.tPlayers,matches:X.tMatches,events:X.tEvents,about:X.tAbout};
    Object.keys(labels).forEach(function(k){
      var el=document.querySelector('.tab[data-t="'+k+'"]');if(el)el.textContent=labels[k];
    });
    var pt=document.querySelector('.tab[data-t=""]');if(pt)pt.textContent=X.tPartners;
    showTab('home');
  }).catch(function(e){
    $('sub').textContent='';
    $('viewHome').innerHTML='<div class="empty" style="color:#ff6b6b">'+esc(e.message)+'</div>';
  });
</script>
