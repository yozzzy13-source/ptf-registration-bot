function pickCard(k){var p=player(k)||{key:k,name:k,pool:'',price:0,score:{}};var locked=activeTeam()&&activeTeam().status==='locked';return'<div class="pick">'+avatar(p)+'<div><div class="name">'+esc(p.name)+' '+(captain===k?'<span class="badge cap">C ×1.5</span>':'')+(vice===k?'<span class="badge">V</span>':'')+'</div><div class="meta">'+esc(p.pool_label||p.pool)+'</div><div class="score">'+esc((p.score&&p.score.total)||0)+' '+esc(X('points'))+' · '+esc((p.score&&p.score.matches)||0)+' '+esc(X('matches'))+'</div><div class="actions">'+(!locked?'<button class="mini '+(captain===k?'on':'')+'" onclick="cap(\''+q(k)+'\')">C</button><button class="mini '+(vice===k?'on':'')+'" onclick="vic(\''+q(k)+'\')">V</button><button class="mini danger" onclick="removePick(\''+q(k)+'\')">'+esc(X('remove'))+'</button>':(D.entry_open?'<button class="mini transfer" onclick="beginTransfer(\''+q(k)+'\')">'+esc(X('replace'))+'</button>':''))+'</div></div><div class="price">'+esc(p.price)+'</div></div>'}
function teamView(){var locked=activeTeam()&&activeTeam().status==='locked';var teamTabs='<div class="tabs" style="grid-template-columns:repeat(2,1fr);margin:0 0 13px"><button class="tab '+(teamSlot===1?'on':'')+'" onclick="chooseTeam(1)">'+esc(L?'Команда 1':'Team 1')+'</button><button class="tab '+(teamSlot===2?'on':'')+'" onclick="chooseTeam(2)">'+esc(teamSlot===2?(L?'Команда 2':'Team 2'):(L?'Создать команду 2':'Create team 2'))+'</button></div>';return teamTabs+summary()+'<div class="card"><div class="field"><label>'+esc(X('teamName'))+'</label><input id="teamName" maxlength="40" value="'+esc(activeTeam()&&activeTeam().team_name||((D.owner_name||'PTF')+' Fantasy'))+'" '+(locked?'disabled':'')+'></div><div class="section-title"><h2>'+esc(X('yourSquad'))+'</h2><small>'+esc(locked?X('locked'):X('draft'))+'</small></div>'+(picks.length?'<div class="squad">'+picks.map(pickCard).join('')+'</div>':'<div class="empty">'+esc(X('emptySquad'))+'</div>')+'<div class="section-title"><h3>'+esc(X('requirements'))+'</h3></div>'+requirements()+'<div id="validation"></div>'+(!locked&&D.entry_open?'<div class="foot-actions"><button class="secondary" onclick="saveTeam(false)">'+esc(X('save'))+'</button><button class="primary" onclick="saveTeam(true)">'+esc(X('lock'))+'</button></div>':(!D.entry_open?'<div class="readonly">🔒 '+esc(X('preview'))+'</div>':''))+'</div>'+(transferOut?'<div class="transfer-banner">'+esc(X('transferPrompt'))+' <b>'+esc((player(transferOut)||{}).name)+'</b>. <button class="mini" onclick="cancelTransfer()">'+esc(X('cancelTransfer'))+'</button></div>':'')}
function tipBlock(p){var good=(p.tips&&p.tips.why||[]).map(function(x){return'<div class="tip-good">✓ '+esc(x)+'</div>'}).join(''),risk=(p.tips&&p.tips.risks||[]).map(function(x){return'<div class="tip-risk">• '+esc(x)+'</div>'}).join('');return'<details class="tips"><summary>'+esc(X('why'))+' / '+esc(X('risk'))+'</summary>'+good+risk+'<div><b>'+esc(X('capTip'))+':</b> '+esc(p.tips&&p.tips.captain||'')+'</div><div class="meta">'+esc(X('price'))+': 10 '+((p.price_breakdown&&p.price_breakdown.adjusted_premium)>=0?'+ ':'')+esc(p.price_breakdown&&p.price_breakdown.adjusted_premium||0)+' = '+esc(p.price)+'</div></details>'}
function playerCard(p){var sel=picked(p.key),locked=activeTeam()&&activeTeam().status==='locked',canTransfer=D.entry_open&&locked&&transferOut&&p.key!==transferOut&&!sel;var h=p.history||{};return'<div class="player">'+avatar(p)+'<div><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(p.pool_label)+' · '+(p.is_debutant?'<span class="badge new">'+esc(X('newcomer'))+'</span>':'<span class="badge">'+esc(X('winrate'))+' '+esc(h.winRate||0)+'%</span>')+'</div><div class="fantasyline"><span class="fchip">✨ '+esc((p.score&&p.score.total)||0)+' '+esc(X('points'))+'</span><span class="fchip">👥 '+esc(X('pickedBy'))+': '+esc(p.selected_by||0)+'</span></div></div><div class="right"><div class="price">'+esc(p.price)+'</div>'+(locked?(canTransfer?'<button class="primary" onclick="doTransfer(\''+q(p.key)+'\')">'+esc(X('chooseInstead'))+'</button>':''):'<button class="'+(sel?'secondary':'primary')+'" onclick="togglePick(\''+q(p.key)+'\')">'+esc(sel?X('selected'):X('add'))+'</button>')+'</div>'+tipBlock(p)+'</div>'}
function playersView(){var groups=D.players.reduce(function(a,p){if(a.indexOf(p.pool)<0)a.push(p.pool);return a},[]),list=D.players.filter(function(p){return(pool==='all'||p.pool===pool)&&(!search||p.name.toLowerCase().indexOf(search.toLowerCase())>=0)}).sort(function(a,b){return b.price-a.price||b.selected_by-a.selected_by||a.name.localeCompare(b.name)});return transferOut?teamView().split('<div class="transfer-banner">')[0]+'<div class="transfer-banner">'+esc(X('transferPrompt'))+' <b>'+esc((player(transferOut)||{}).name)+'</b>. <button class="mini" onclick="cancelTransfer()">'+esc(X('cancelTransfer'))+'</button></div>'+catalog(groups,list):catalog(groups,list)}
function catalog(groups,list){return'<input class="search" value="'+esc(search)+'" oninput="setSearch(this.value)" placeholder="'+esc(X('search'))+'"><div class="filters"><button class="filter '+(pool==='all'?'on':'')+'" onclick="setPool(\'all\')">'+esc(X('all'))+'</button>'+groups.map(function(g){var p=D.players.find(function(x){return x.pool===g});return'<button class="filter '+(pool===g?'on':'')+'" onclick="setPool(\''+q(g)+'\')">'+esc(p&&p.pool_label||g)+'</button>'}).join('')+'</div><div>'+list.map(playerCard).join('')+'</div>'}
function rankingRows(list,kind){if(!list.length)return'<div class="empty">'+esc(kind==='teams'?X('noTeams'):X('noPlayers'))+'</div>';return list.map(function(x){var medal=x.place===1?'🥇':x.place===2?'🥈':x.place===3?'🥉':x.place,pic=kind==='teams'?{name:x.owner_name,photo:x.owner_photo}:x;return'<div class="leader"><div class="place">'+medal+'</div>'+avatar(pic)+'<div><div class="name">'+esc(kind==='teams'?x.team_name:x.name)+'</div><div class="meta">'+(kind==='teams'?esc(x.owner_name)+' · '+esc(x.transfers_used)+' '+esc(X('transfers').toLowerCase()):esc(x.pool_label)+' · '+esc(X('pickedBy'))+': '+esc(x.selected_by||0))+'</div></div><div class="pts">'+esc(kind==='teams'?x.points:x.points)+'</div></div>'}).join('')}
function tableView(){var list=rankMode==='teams'?(D.leaderboard||[]):(D.player_leaderboard||[]);return'<div class="ranktabs"><button class="'+(rankMode==='teams'?'on':'')+'" onclick="rankMode=\'teams\';render()">'+esc(X('teamRating'))+'</button><button class="'+(rankMode==='players'?'on':'')+'" onclick="rankMode=\'players\';render()">'+esc(X('playerRating'))+'</button></div><div class="card"><div class="section-title" style="margin-top:0"><h2>'+esc(rankMode==='teams'?X('teamRating'):X('playerRating'))+'</h2><small>'+list.length+'</small></div>'+rankingRows(list,rankMode)+'</div>'}
function rulesView(){var order=['intro','format','squad','budget','pricing','locking','captain','transfers','scoring','ranking','tip'];return'<div class="card rules"><h2 style="margin-bottom:15px">'+esc(D.rules.title)+'</h2>'+order.map(function(k){return D.rules[k]?'<p>'+esc(D.rules[k])+'</p>':''}).join('')+'</div>'}
function render(){if(!D)return;document.documentElement.lang=L?'ru':'en';document.getElementById('app').innerHTML=header()+(tab==='home'?homeView():tab==='team'?teamView():tab==='players'?playersView():tab==='table'?tableView():rulesView());[].forEach.call(document.querySelectorAll('[data-th]'),function(b){b.onclick=function(){theme(b.dataset.th);render()};b.classList.toggle('on',document.documentElement.getAttribute('data-theme')===b.dataset.th)});if(tab==='team'&&!(activeTeam()&&activeTeam().status==='locked'))validate(false)}
function go(v){tab=v;render();window.scrollTo(0,0)}function setPool(v){pool=v;render()}function setSearch(v){search=v;var pos=document.activeElement&&document.activeElement.selectionStart;render();var e=document.querySelector('.search');if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
function togglePick(k){if(picked(k))removePick(k);else{if(picks.length>=D.roster_size)return toast(L?'Можно выбрать только 8 игроков.':'You may select only 8 players.');picks.push(k);render()}}
function removePick(k){picks=picks.filter(function(x){return x!==k});if(captain===k)captain='';if(vice===k)vice='';render()}function cap(k){captain=k;if(vice===k)vice='';render()}function vic(k){vice=k;if(captain===k)captain='';render()}
function payload(complete){return{team_slot:teamSlot,team_name:(document.getElementById('teamName')||{}).value||'',picks:picks,captain_key:captain,vice_key:vice,complete:complete}}
function validate(complete){api('/api/fantasy/validate',payload(complete)).then(function(j){var v=j.validation,e=document.getElementById('validation');if(!e)return;var out='';if(v.errors&&v.errors.length)out+='<div class="message bad">'+v.errors.map(esc).join('<br>')+'</div>';if(v.warnings&&v.warnings.length)out+='<div class="message warn">'+v.warnings.map(esc).join('<br>')+'</div>';if(!out&&picks.length===D.roster_size)out='<div class="message good">✓ '+esc(L?'Состав соответствует правилам.':'Squad follows the rules.')+'</div>';e.innerHTML=out}).catch(function(){})}
function saveTeam(lock){if(!D.entry_open)return toast(X('preview'));if(lock&&!confirm(X('confirmLock')))return;var b=payload(lock);b.action=lock?'lock':'draft';api('/api/fantasy/team',b).then(function(){toast(lock?X('done'):X('saved'));load()}).catch(function(e){toast(e.message);validate(lock)})}
function beginTransfer(k){transferOut=k;tab='players';render();window.scrollTo(0,0)}function cancelTransfer(){transferOut='';tab='team';render()}
function doTransfer(k){if(!transferOut||!confirm(X('confirmTransfer')))return;api('/api/fantasy/transfer',{team_slot:teamSlot,player_out_key:transferOut,player_in_key:k}).then(function(){toast(X('transferDone'));transferOut='';tab='team';load()}).catch(function(e){toast(e.message)})}
function load(){document.getElementById('app').innerHTML='<div class="loading">'+esc(X('loading'))+'</div>';api('/api/fantasy/bootstrap').then(function(j){D=j;L=j.lang==='ru';var t=activeTeam();picks=(t&&t.picks||[]).map(function(p){return p.key});captain=t&&t.captain_key||'';vice=t&&t.vice_key||'';render()}).catch(function(e){document.getElementById('app').innerHTML='<div class="top"><div><div class="eyebrow">Phuket Tennis Family</div><h1>Fantasy</h1></div></div><div class="card empty"><h2>'+esc(X('access'))+'</h2><p>'+esc(e.message)+'</p></div>'})}
try{theme(localStorage.getItem('ptf_theme')==='light'?'light':'dark')}catch(e){theme('dark')}load();
</script></body></html>
