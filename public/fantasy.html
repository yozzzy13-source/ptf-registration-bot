<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PTF Fantasy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0a0b;--panel:#111214;--panel2:#18191c;--line:#303136;--text:#f5f2ec;--muted:#a9a59e;--accent:#e7a049;--accent2:#f4bd73;--green:#54b884;--red:#e66e67;--blue:#78aee8;--shadow:0 14px 34px rgba(0,0,0,.25)}
html[data-theme=light]{--bg:#f2f5f1;--panel:#fff;--panel2:#f4f6f2;--line:#cdd5cc;--text:#18201c;--muted:#68716a;--accent:#d8892e;--accent2:#b86c19;--green:#24885c;--red:#c44f48;--blue:#397dbd;--shadow:0 12px 32px rgba(37,55,43,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}.app{max-width:760px;margin:auto;padding:22px 18px calc(42px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:8px 0 20px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.top h1{font-size:34px;line-height:1;margin:5px 0 7px}.sub{color:var(--muted);font-size:14px}.theme{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}.theme button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 10px}.theme button.on{background:var(--panel2);color:var(--text)}
.banner{border:1px solid rgba(231,160,73,.55);background:rgba(231,160,73,.12);border-radius:18px;padding:13px 15px;margin-bottom:14px;color:var(--accent2);font-size:13px;font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0 16px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:15px;padding:12px 5px;font-weight:800;font-size:13px}.tab.on{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:13px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:var(--panel2);border-radius:15px;padding:11px 8px;text-align:center}.stat b{display:block;font-size:19px}.stat span{display:block;color:var(--muted);font-size:10px;margin-top:3px;text-transform:uppercase;font-weight:800}
.field label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin:0 0 6px}.field input,.search{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:12px 13px;outline:none}.field input:focus,.search:focus{border-color:var(--accent)}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:21px 2px 10px}.section-title h2{font-size:20px}.section-title small{color:var(--muted)}
.squad{display:grid;gap:9px}.pick,.player{display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:11px}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--panel2);display:grid;place-items:center;font-weight:900;color:var(--accent)}.name{font-weight:850;line-height:1.16}.meta{color:var(--muted);font-size:12px;margin-top:4px}.price{color:var(--accent);font-weight:900;white-space:nowrap}.score{font-size:11px;color:var(--green);margin-top:3px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.mini{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:7px 9px;font-size:11px;font-weight:800}.mini.on{background:var(--accent);border-color:var(--accent);color:#17110a}.mini.danger{color:var(--red)}.mini.transfer{color:var(--blue)}
.primary,.secondary{border:0;border-radius:15px;padding:13px 16px;font-weight:900}.primary{background:var(--accent);color:#1c1309}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.primary:disabled,.secondary:disabled,.mini:disabled{opacity:.45}.foot-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.requirements{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.req{border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:750}.req.ok{border-color:rgba(84,184,132,.55);color:var(--green)}
.message{margin-top:10px;border-radius:13px;padding:10px 12px;font-size:12px;line-height:1.4}.message.bad{background:rgba(230,110,103,.12);color:var(--red)}.message.warn{background:rgba(231,160,73,.1);color:var(--accent2)}.message.good{background:rgba(84,184,132,.1);color:var(--green)}
.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);padding:8px 11px;font-size:12px;font-weight:800}.filter.on{border-color:var(--accent);color:var(--accent)}
.player{align-items:start;margin-bottom:9px}.player .right{text-align:right}.player .primary{padding:8px 11px;font-size:12px;margin-top:8px}.tips{grid-column:2/4;border-top:1px solid var(--line);padding-top:9px;color:var(--muted);font-size:12px;line-height:1.45}.tips b{color:var(--text)}.tip-good{color:var(--green)}.tip-risk{color:var(--accent2)}details summary{cursor:pointer;color:var(--muted);font-weight:750}
.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--panel2);font-size:10px;color:var(--muted);font-weight:800;margin-right:4px}.badge.new{color:var(--blue)}.badge.cap{color:var(--accent)}
.leader{display:grid;grid-template-columns:34px 42px 1fr auto;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line)}.leader .avatar{width:42px;height:42px}.clubhero{position:relative;overflow:hidden;padding:22px;background:linear-gradient(145deg,rgba(231,160,73,.2),var(--panel) 58%)}.clubhero:after{content:'PTF';position:absolute;right:-10px;bottom:-30px;font-size:96px;font-weight:950;color:rgba(231,160,73,.06)}.clubmark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent2),var(--accent));color:#1c1309;font-size:28px;box-shadow:0 10px 26px rgba(231,160,73,.24);margin-bottom:15px}.clubhero h2{font-size:25px;margin:0 0 8px}.clubhero p{position:relative;z-index:1;color:var(--muted);line-height:1.55;margin:0}.clubgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.clubcell{background:rgba(0,0,0,.13);border:1px solid var(--line);border-radius:14px;padding:11px}.clubcell b{display:block;font-size:17px;color:var(--accent)}.clubcell span{font-size:10px;color:var(--muted);font-weight:800}.launch{display:flex;gap:8px;margin-top:15px;position:relative;z-index:1}.launch button{flex:1}.ranktabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}.ranktabs button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:12px;padding:10px;font-weight:850}.ranktabs button.on{border-color:var(--accent);color:var(--accent)}.fantasyline{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.fchip{font-size:10px;font-weight:850;color:var(--accent);border:1px solid rgba(231,160,73,.35);background:rgba(231,160,73,.09);padding:4px 7px;border-radius:999px}.readonly{border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:11px 13px;border-radius:14px;font-size:12px;line-height:1.45;margin-bottom:12px}.leader:last-child{border-bottom:0}.leader.fantasy-player{grid-template-columns:42px minmax(0,1fr) auto;padding:12px 4px}.leader.fantasy-player .right{text-align:right}.leader.fantasy-player .price{font-size:12px;margin-top:2px}.leader.fantasy-player button{margin-top:7px;padding:7px 9px;font-size:11px}.place{font-size:20px;font-weight:900;text-align:center}.pts{font-weight:900;color:var(--accent);font-size:18px}.rules p{color:var(--muted);line-height:1.55;margin:0 0 13px}.rules b{color:var(--text)}.empty{text-align:center;color:var(--muted);padding:42px 18px}.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90%;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:13px;font-weight:750;z-index:9;box-shadow:var(--shadow)}.transfer-banner{border:1px solid var(--blue);background:rgba(120,174,232,.1);color:var(--blue);border-radius:15px;padding:11px 13px;margin-bottom:11px}
@media(max-width:520px){.app{padding-left:13px;padding-right:13px}.top h1{font-size:30px}.summary{grid-template-columns:repeat(2,1fr)}.tabs{gap:4px}.tab{font-size:10px;padding:11px 2px}.card{padding:14px}.pick,.player{grid-template-columns:42px 1fr auto}.avatar{width:42px;height:42px}.clubgrid{grid-template-columns:repeat(3,1fr)}.leader{grid-template-columns:30px 38px 1fr auto}.leader .avatar{width:38px;height:38px}}

/* Fantasy reuses League Noir/Court tokens and Race row geometry. */
:root{--panel:#111010;--panel2:#161514;--line:#2A2521;--line2:#221F1B;--text:#EFEBE4;--muted:#B9B1A5;--accent:#E8A45C;--green:#8FBF9A;--red:#C2695E;--onAccent:#12100E}
html[data-theme=light]{--panel:#FFF;--panel2:#F5F8F4;--line:#C7D3C5;--line2:#DDE5DB;--text:#16211A;--muted:#4C5A50;--accent:#1F6B44;--accent2:#145236;--green:#1F6B44;--red:#B04A2E;--onAccent:#FFF}
.primary,.mini.on{color:var(--onAccent)}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default}.full{width:100%;margin-top:14px}.tabs{grid-template-columns:repeat(4,1fr)}.card{border-radius:18px}.card h2{font-size:22px;line-height:1.2}.card p{line-height:1.5}.card details{margin-top:14px}.clubhero p{margin-top:12px}.clubhero:after{pointer-events:none}.clubhero .primary{position:relative;z-index:1}.clubcell{padding:10px 8px}.clubcell span{font-size:11px}.clubcell b{font-size:22px}.clubgrid{margin-bottom:16px}
.progress{list-style:none;display:flex;gap:4px;margin:0 0 16px;padding:0}.progress li{flex:1;min-width:0;color:var(--muted);text-align:center;font-size:10px}.progress b{display:block;margin:0 auto 5px;width:28px;height:28px;line-height:26px;border:1px solid var(--line);border-radius:50%;font-size:12px}.progress .on{color:var(--accent)}.progress .on b{border-color:var(--accent)}.progress .done b{color:var(--green)}
.selection-summary{position:sticky;top:0;z-index:3;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);margin:0 0 14px}.budget-line{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:10px}.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.slots .req{text-align:center;padding:7px 3px;font-size:11px;border-radius:10px}.req.current{border-color:var(--accent);color:var(--accent);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent)}.slot-instruction{font-size:12px;line-height:1.4}.error{color:var(--red)}.wizard-actions{display:flex;gap:8px;position:sticky;bottom:0;z-index:4;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--bg);margin-top:14px}.wizard-actions button{flex:1}.pick{margin-top:8px;min-width:0}.pick .name{overflow-wrap:anywhere}.pick .mini{min-height:40px}.player-name{min-width:0;overflow-wrap:anywhere}.player-name small{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:4px;line-height:1.25}
.tb{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}.fantasy-catalog .thd,.fantasy-catalog .trw{display:grid;grid-template-columns:18px 36px minmax(0,1fr) 32px 45px 32px;gap:5px;padding:0 8px;align-items:center}.fantasy-catalog.selecting .thd,.fantasy-catalog.selecting .trw{grid-template-columns:18px 36px minmax(0,1fr) 32px 45px 30px 44px}.fantasy-catalog .thd{min-height:40px;background:var(--panel2);font-size:8px;font-weight:800;color:var(--muted)}.fantasy-catalog .trw{min-height:76px;padding-top:9px;padding-bottom:9px;border-top:1px solid var(--line2);font-size:12px;color:var(--text)}.fantasy-catalog .trw>span,.fantasy-catalog .thd>span{text-align:center}.fantasy-catalog .avatar{width:36px;height:36px;font-size:11px;object-position:50% 26%}.fantasy-catalog .pts,.fantasy-catalog .price{font-size:12px}.fantasy-catalog .place{font-size:11px;color:var(--muted)}.fantasy-catalog .mini{width:44px;min-height:44px;padding:4px;font-size:18px}.fantasy-catalog.selecting .mini{margin-left:8px}.fantasy-catalog.selecting button.price-toggle{margin-right:2px}.slots-howto{margin:0 0 10px;font-size:11.5px;color:var(--muted);line-height:1.45}.filters button{min-height:40px}.search,.field input{font-size:16px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.message{margin-bottom:12px}.rules summary{padding:3px 0}.rules p{margin:12px 0 0}.pick .price{align-self:start;padding-top:4px}
button.price-toggle{background:none;border:0;padding:0;margin:0;font:inherit;color:var(--accent);font-weight:900;text-decoration:underline dotted;text-underline-offset:3px;justify-self:end}
.trw-wrap{border-top:1px solid var(--line2)}.trw-wrap .trw{border-top:0}
.price-breakdown{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:8px 10px;margin:0 8px 9px;font-size:11.5px}
.pick .price-breakdown{margin:0}
.pbd-row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line2)}
.pbd-row:last-child{border-bottom:0}.pbd-row b{font-weight:800;white-space:nowrap}
.pbd-row b.pos{color:var(--green)}.pbd-row b.neg{color:var(--red)}
.pbd-row.total{margin-top:2px;padding-top:6px;border-top:1px dashed var(--line);font-weight:800}
.pbd-row.total b{color:var(--accent)}
.pbd-row.note{color:var(--muted);font-style:italic}.pbd-row.note.good{color:var(--green);font-style:normal}.pbd-row.note.bad{color:var(--red);font-style:normal}
.searchwrap{position:relative}
.psug{position:absolute;left:0;right:0;top:calc(100% - 10px);z-index:5;background:var(--panel2);border:1px solid var(--line);
border-radius:12px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.28)}
.psug .pi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);
padding:10px 13px;font:inherit;font-size:13px;color:var(--text);cursor:pointer}
.psug .pi:last-child{border-bottom:0}
.psug .pi:hover,.psug .pi:active{background:var(--panel)}
.intro-backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
html[data-theme=light] .intro-backdrop{background:rgba(20,25,20,.4)}
.intro-card{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-top-left-radius:22px;border-top-right-radius:22px;
padding:22px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.35)}
.intro-card h2{margin:10px 0 8px;font-size:21px}
.intro-card p{color:var(--muted);line-height:1.5;margin:0 0 12px}
.intro-card p.sub{font-size:12px}
.intro-steps{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.intro-steps li{background:var(--panel2);border:1px solid var(--line2);border-radius:13px;padding:10px 12px;font-size:13px;line-height:1.4}
.intro-steps li b{color:var(--accent);margin-right:6px}
.player-name-btn{background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0;overflow-wrap:anywhere}
@media(max-width:380px){.app{padding-left:10px;padding-right:10px}.fantasy-catalog .thd,.fantasy-catalog .trw{gap:3px;padding-left:5px;padding-right:5px}.fantasy-catalog.selecting .thd,.fantasy-catalog.selecting .trw{grid-template-columns:14px 30px minmax(0,1fr) 28px 38px 26px 44px}.fantasy-catalog .avatar{width:30px;height:30px}.progress li{font-size:9px}.budget-line{font-size:11px}}


.app[data-view=wizard] .top{margin:0 0 12px;align-items:center}.app[data-view=wizard] .top h1{font-size:24px;margin:0 0 4px}.app[data-view=wizard] .top .eyebrow,.app[data-view=wizard] .tabs{display:none}.app[data-view=wizard] .banner{padding:9px 12px;border-radius:12px;font-size:12px;margin-bottom:12px}.app[data-view=wizard] .section-title{margin:14px 2px 10px}.wizard-actions.selection-actions{position:static}.progress span{overflow-wrap:anywhere}
</style>
</head>
<body><main class="app" id="app"><div class="loading">PTF Fantasy…</div></main><div id="toast" class="toast hidden"></div>
<script type="module" src="/public/fantasy-onboarding.js"></script></body></html>
