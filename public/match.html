<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PTF Matches</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/public/ptf-prefs.js"></script>
<script src="/public/ptf-nav.js"></script>
<style>
/* Палитра лиги: та же, что в витрине, чтобы экраны матчей не выглядели
   отдельным приложением. Старые имена переменных сохранены — так правка
   не задевает разметку и логику. */
:root{
  --bg:#0A0A0B;--card:#111010;--card2:#0D0C0B;--text:#EFEBE4;--muted:#B9B1A5;
  --accent:#E8A45C;--accent2:#C9873C;--border:#2A2521;--line2:#221F1B;
  --danger:#C2695E;--green:#8FBF9A;--green2:#2A3A2E;--yellow:#C9A76A;--champ:#D9C7A3;
  /* Раньше эти пять ссылались сами на себя и в тёмной теме не работали вовсе:
     выбранные даты, корты и вкладки оставались без подсветки. */
  --accBg:rgba(232,164,92,.12);--accBg2:rgba(232,164,92,.18);--accLine:rgba(232,164,92,.34);--onAcc:#12100E;--avBg:#1C1A18;
  --grain:rgba(255,255,255,.03);--fadeNone:rgba(10,10,11,0);
  --mute:#8A7F6F;--hair:rgba(255,255,255,.05);--tile:#141312;
}
/* Светлая тема Court — те же роли, другой свет. Выбор общий с витриной лиги. */
html[data-theme="light"]{
  --bg:#F2F5F1;--card:#FFFFFF;--card2:#EBF0EA;--text:#16211A;--muted:#4C5A50;
  --accent:#1F6B44;--accent2:#145236;--border:#C7D3C5;--line2:#DDE5DB;
  --danger:#B04A2E;--green:#1F6B44;--green2:#E1F0E7;--yellow:#8E9A2E;--champ:#6E7A22;
  --accBg:#E1F0E7;--accBg2:#D3E9DC;--accLine:#A6D2BB;--onAcc:#FFFFFF;--avBg:#E7EDE6;
  --grain:rgba(0,0,0,.02);--fadeNone:rgba(242,245,241,0);
  --mute:#7E8B82;--hair:rgba(0,0,0,.03);--tile:#F4F7F3;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
background:var(--bg);color:var(--text);min-height:100vh;padding:0 14px 40px;position:relative}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
background-image:radial-gradient(var(--grain) .5px,transparent .5px);background-size:3px 3px}
.wrap{position:relative;z-index:1}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:22px;font-weight:800;letter-spacing:-.6px;margin:14px 0 4px}
.sub{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 12px}
.tabs{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;background:linear-gradient(180deg,var(--bg) 78%,var(--fadeNone));margin-bottom:4px}
.tab{flex:1 1 22%;text-align:center;padding:10px 6px;border-radius:12px;background:var(--card2);border:1px solid var(--border);font-size:12.5px;font-weight:800;cursor:pointer;user-select:none;color:var(--muted)}
.tab.on{border-color:var(--accLine);background:linear-gradient(180deg,var(--accBg2),var(--accBg));color:var(--accent)}
/* Ход за тобой — вкладка «Вызовы» горит, иначе входящее предложение легко проспать. */
.tab.hot{color:var(--accent);border-color:var(--accLine)}
.tab.hot:after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle;animation:pulseDot 1.6s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin:0 0 12px}
label{display:block;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:800;color:var(--muted);margin:12px 0 6px}
label:first-of-type{margin-top:0}
select,input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:15px;font-family:inherit}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.searchwrap{position:relative}
.bigscore{font-size:30px;font-weight:800;letter-spacing:1px;margin:10px 0 2px}
.psug{position:absolute;left:0;right:0;top:calc(100% - 4px);z-index:9;background:var(--card2);border:1px solid var(--border);
border-radius:12px;overflow-y:auto;max-height:46vh;-webkit-overflow-scrolling:touch;box-shadow:0 14px 30px rgba(0,0,0,.28)}
.sugx{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;
display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:17px;cursor:pointer;z-index:10}
.sugx:active{background:var(--card)}
.searchwrap input{padding-right:38px}
.psug .pi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);
margin:0;padding:10px 13px;font:inherit;font-size:14px;font-weight:400;color:var(--text);cursor:pointer}
.psug .pi:last-child{border-bottom:0}
.psug .pi:hover,.psug .pi:active{background:var(--card)}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:15px;font-weight:900;margin-top:14px;cursor:pointer;background:var(--card2);color:var(--text);border:1px solid var(--border);font-family:inherit}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onAcc);border:0;font-weight:900}
button.mini{width:auto;margin:0;padding:9px 14px;font-size:13px;border-radius:11px}
.dowhead,.datestrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dowhead{padding:0 0 4px}
.dowlabel{text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.3px;opacity:.5;font-weight:800}
.daycell{padding:9px 4px 7px;border-radius:12px;background:var(--card2);text-align:center;cursor:pointer;border:1px solid var(--border);transition:.15s;user-select:none;min-width:0}
.daycell.sel{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--onAcc);border-color:var(--accent)}
.daycell.past{opacity:.22;cursor:default;border-color:transparent}
.daycell .dnum{font-size:17px;font-weight:800;line-height:1.15}
.daycell .dmon{font-size:9px;opacity:.6;font-weight:700;margin-top:2px}
.slot{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:16px;padding:14px;margin:0 0 10px}
.slot.mine{border-left-color:var(--green)}
.slot.agreed{border-left-color:var(--green)}
.slot-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{width:38px;height:38px;border-radius:50%;flex:0 0 38px;background:var(--avBg);object-fit:cover;object-position:50% 32%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--mute,var(--muted))}
.who{font-weight:800;font-size:15px;line-height:1.25}
.when{font-size:14px;margin:2px 0}
.meta{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.5}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;border:1px solid var(--line2);background:var(--card2);color:var(--muted);margin:2px 4px 2px 0}
.pill.acc{background:var(--green2);border-color:var(--accLine);color:var(--green)}
.pill.open{background:var(--accBg);border-color:var(--accLine);color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opp{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--card2);margin-bottom:8px;cursor:pointer}
.opp.sel{border-color:var(--accLine);background:linear-gradient(180deg,var(--accBg2),var(--accBg))}
.opp .who{font-size:14px}
.hint{color:var(--muted);font-size:12px;line-height:1.5;margin-top:8px}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 10px;line-height:1.5}
.res{margin-top:12px;font-size:14px;line-height:1.5}
.res.ok{background:var(--green2);border:1px solid var(--accLine);color:var(--green);padding:12px;border-radius:12px}
.res.err{color:var(--danger)}
.hidden{display:none}
.seg{display:flex;gap:8px;margin-bottom:4px}
.seg .s{flex:1;text-align:center;padding:10px 6px;border-radius:12px;background:var(--card2);border:1px solid var(--border);font-size:12.5px;font-weight:800;cursor:pointer;color:var(--muted)}
.seg .s.on{border-color:var(--accLine);background:linear-gradient(180deg,var(--accBg2),var(--accBg));color:var(--accent)}
.daycell.on{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--onAcc);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--border);font-size:12.5px;font-weight:800;cursor:pointer;user-select:none;color:var(--muted)}
.chip.on{border-color:var(--accLine);background:linear-gradient(180deg,var(--accBg2),var(--accBg));color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:18px 16px 22px;width:100%;max-width:620px;max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:17px}
.setrow{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center;margin-bottom:8px}
.setrow .lbl{font-size:12px;font-weight:800;color:var(--muted);min-width:44px}
.setrow .dash{text-align:center;color:var(--muted);font-weight:800}
.tbrow{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center;margin:0 0 10px;padding-left:0}
.tbrow .lbl{font-size:11px;color:var(--muted);font-weight:700;min-width:44px}
/* .hidden описан выше и при равной силе проигрывает — строку тай-брейка это
   держало открытой всегда. Гасим её явно: она нужна только при счёте 7:6. */
.tbrow.hidden,.setrow.hidden,.scorehead.hidden{display:none}
.scorehead{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center;margin:0 0 4px}
.scorehead .lbl{min-width:44px}
.scorehead .nm{font-size:12px;font-weight:800;color:var(--muted);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scorehead .nm.win{color:var(--text)}
.scorehead .dash{text-align:center;color:var(--muted);font-weight:800}
.photo-btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px dashed var(--accLine);background:var(--card2);color:var(--accent);text-align:center;font-size:13px;font-weight:800;cursor:pointer}
.photo-prev{width:100%;border-radius:12px;margin-top:8px;max-height:220px;object-fit:cover}

/* Календарь: сразу видны две недели, остальное открывается свайпом или тапом
   по язычку — иначе три ряда дат съедают весь экран. */
.dtwrap{position:relative;overflow:hidden;transition:max-height .3s ease}
.dtwrap.open{max-height:none!important}
.dtwrap:not(.open):after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;
  pointer-events:none;background:linear-gradient(180deg,var(--fadeNone),var(--card))}
.dtmore{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:6px;border-radius:10px;border:1px solid var(--border);background:var(--card2);
  color:var(--muted);font-size:11px;font-weight:800;cursor:pointer;user-select:none}
.dtmore i{font-style:normal;font-size:12px;line-height:1}

/* Переключатель темы — те же два ярлычка, что в витрине лиги. */
.ttop{display:flex;align-items:center;gap:10px}
.ttop h1{flex:1 1 auto;min-width:0}
.thsw{display:flex;gap:3px;padding:3px;border:1px solid var(--border);border-radius:999px;
  background:var(--card);flex:0 0 auto}
.thsw button{width:27px;height:24px;border:0;border-radius:999px;background:transparent;
  color:var(--muted);font-size:13px;line-height:1;cursor:pointer;padding:0;display:flex;
  align-items:center;justify-content:center;font-family:inherit}
.thsw button.on{background:var(--accBg);color:var(--accent);box-shadow:0 0 0 1px var(--accLine) inset}
.action-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;padding:1px 4px;border-radius:12px;background:#d63c47;color:#fff;animation:attentionPulse 1.8s ease-in-out infinite;font-size:12px}
@keyframes attentionPulse{50%{box-shadow:0 0 0 4px #d63c4730}}@media(prefers-reduced-motion:reduce){.action-count{animation:none}}
.tab.hot:after{display:none;animation:none}
/* ---------- шапка и меню сайта: один в один с витриной лиги ---------- */
.hdr{display:flex;align-items:center;gap:12px;padding:14px 0 12px}
.hdr .logo{width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center}
.hdr .logo img{width:40px;height:40px;display:block}
html[data-theme="light"] .hdr .logo img{filter:invert(1) brightness(.28) saturate(.6)}
.hdr .ht{flex:1;min-width:0}
.hdr .eyebrow{font-size:9px;letter-spacing:2.6px;text-transform:uppercase;font-weight:800;color:var(--mute);margin-bottom:3px}
.hdr h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1}
.mnav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:2px 0 14px}
.mnav.five{grid-template-columns:repeat(5,1fr)}
.mnav .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 3px 7px;
  background:var(--card2);border:1px solid var(--line2);border-radius:10px;color:var(--muted);text-decoration:none;
  font-size:10.5px;font-weight:700;min-width:0}
.mnav.five .tab{font-size:9.8px}
.mnav .tab.on{background:linear-gradient(180deg,var(--accBg2),var(--accBg));color:var(--accent);border-color:var(--accLine)}
.mnav .nvi{width:18px;height:18px;opacity:.85}
.mnav .tab.on .nvi{opacity:1}
.mnav .tl{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Разделы «Моих матчей» — сегментированный переключатель под меню сайта:
   видно, что это вторая ступень, а не ещё одно меню того же уровня. */
.tabs.subtabs{gap:4px;padding:5px;border:1px solid var(--line2);border-radius:14px;background:var(--card2);
  top:0;margin:0 0 14px;box-shadow:0 10px 14px -10px var(--bg)}
.tabs.subtabs .tab{flex:1 0 auto;min-width:max-content;border:0;background:transparent;border-radius:10px;padding:9px 10px;font-size:12px;white-space:nowrap}
/* Крупный шрифт в настройках телефона или длинные русские подписи: раньше
   надписи обрезались («списание», «Результ»). Теперь вкладки шириной по
   тексту, а если не влезают — ряд листается пальцем. */
.tabs.subtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs.subtabs::-webkit-scrollbar{display:none}
.tabs.subtabs .tab.on{background:var(--card);color:var(--accent);box-shadow:0 0 0 1px var(--accLine) inset}
.sub{font-size:12.5px;margin:0 2px 10px}
/* Карточки — та же рука, что в лиге: светлая кромка сверху, мягкие углы. */
.card,.slot{box-shadow:inset 0 1px 0 var(--hair)}
.slot{border-radius:16px}
.who{letter-spacing:-.2px}
@media (min-width:900px){
  .wrap{max-width:820px;zoom:1.12}
  .mnav,.mnav.five{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
  .mnav .tab,.mnav.five .tab{font-size:11.5px;padding:9px 4px 8px}
}
@media (min-width:1200px){.wrap{zoom:1.22}}
.daycell.available{border-color:var(--accent);background:var(--green2);cursor:pointer}.daycell.available:after{content:'●';font-size:8px;color:var(--accent)}
</style>
</head>

  document.documentElement.setAttribute('data-theme',_th); }catch(e){}

var X=L?T.ru:T.en;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function pad(n){return n<10?'0'+n:''+n}
function min2hm(m){return pad(Math.floor(m/60)%24)+':'+pad(m%60)}
function hm2min(hm){var p=String(hm).split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0)}
// Шаг 30 минут делаем через <select>: у <input type="time"> атрибут step игнорируется
// системным WebView Telegram на iOS, и игрок может выкрутить произвольную минуту.
function timeOptions(sel,minHM,maxHM){
  var minM=minHM?hm2min(minHM):6*60,maxM=maxHM?hm2min(maxHM):22*60+30,o='';
  for(var m=Math.ceil(minM/30)*30;m<=maxM;m+=30){var hm=pad(Math.floor(m/60))+':'+pad(m%60);o+='<option value="'+hm+'"'+(hm===sel?' selected':'')+'>'+hm+'</option>'}
  return o;
}
// Две недели видно всегда, третья — по свайпу вверх/вниз внутри календаря
// или тапом по язычку. Высоту считаем по реальной ячейке, а не на глаз.
// Тема: ключ общий с витриной лиги, поэтому выбор переносится между экранами.
// Переключатель общий для всех мини-приложений (public/ptf-prefs.js): тема и
// язык. После смены языка экран перезагружается — так все подписи, даты и
// вкладки гарантированно перерисуются на новом языке.
// --------------------------------------------------- общее меню сайта
// Те же вкладки, что видит этот человек в лиге, плюс «Мои матчи» (активная).
// Вкладки лиги открывают витрину: на сайте — главную, в Telegram — /league.
function goLeague(tab){ location.href=window.PTFNav?PTFNav.hrefFor(tab,{web:IS_WEB,token:linkToken}):(IS_WEB?'/':'/league'); }
function drawNav(tabs){
  var el=$('mnav');if(!el||!window.PTFNav)return;
  var lab=PTFNav.labels(L);
  var keys=(tabs&&tabs.length?tabs:['home','div','race','players','matches']).slice();
  var at=keys.indexOf('matches');keys.splice(at>=0?at+1:keys.length,0,'mymatches');
  el.classList.toggle('five',keys.length>8);
  el.innerHTML=keys.map(function(k){
    var on=k==='mymatches';
    return '<a class="tab'+(on?' on':'')+'" href="'+esc(PTFNav.hrefFor(k,{web:IS_WEB,token:linkToken}))+'">'+PTFNav.icon(k)+'<span class="tl">'+esc(lab[k]||k)+'</span></a>';
  }).join('');
}
function loadNav(){
  drawNav(null);
  fetch('/api/league/nav?initData='+encodeURIComponent(initData)+tokQ+'&lang='+(L?'ru':'en'),{cache:'no-store'})
    .then(function(r){return r.json()}).then(function(j){if(j&&j.ok)drawNav(j.tabs)}).catch(function(){});
}
function initTheme(){

}

function dtMore(){
  return '<div class="dtmore" data-more="1"><i>⌄</i>'+(L?'Ещё даты':'More dates')+'</div>';
}
function foldStrips(){
  var list=document.querySelectorAll('.dtwrap.fold:not([data-ready])');
  [].forEach.call(list,function(w){
    w.setAttribute('data-ready','1');
    var cell=w.querySelector('.daycell');
    if(!cell)return;
    var h=cell.getBoundingClientRect().height;
    if(!h)return;
    w.style.maxHeight=Math.round(h*2+6)+'px';
    var tab=w.nextElementSibling;
    var toggle=function(open){
      w.classList.toggle('open',open);
      if(tab&&tab.classList.contains('dtmore')){
        tab.innerHTML='<i>'+(open?'⌃':'⌄')+'</i>'+(open?(L?'Свернуть':'Less'):(L?'Ещё даты':'More dates'));
      }
    };
    if(tab&&tab.classList.contains('dtmore'))tab.onclick=function(){ toggle(!w.classList.contains('open')) };
    var y0=null;
    w.addEventListener('touchstart',function(e){ y0=e.touches[0].clientY },{passive:true});
    w.addEventListener('touchmove',function(e){
      if(y0===null)return;
      var dy=e.touches[0].clientY-y0;
      if(Math.abs(dy)<26)return;
      toggle(dy>0);
      y0=null;
    },{passive:true});
  });
}
function isoDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtDay(iso){
  var d=new Date(iso+'T00:00:00');if(isNaN(d))return iso;
  var wd=(L?['Вс','Пн','Вт','Ср','Чт','Пт','Сб']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'])[d.getDay()];
  var mo=(L?['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек']:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'])[d.getMonth()];
  return wd+', '+d.getDate()+' '+mo;
}
function initials(n){return String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(function(s){return s[0].toUpperCase()}).join('')}

// Вкладок четыре: Расписание, Вызовы, Корт, Результат. «Создать вызов» — это не

function showTab(t){
  if(t==='admin'&&!isAdmin)t='mine';
  if (!canMatch && ['open','new','res'].includes(t)) { $('viewOpen').innerHTML='<div class="empty">'+esc(X.subNone)+'</div>'; t='open'; }
  mode=t;
  var onTab=(t==='new')?'open':t;
  ['open','new','mine','res','book','admin'].forEach(function(k){
    var tab=document.querySelector('.tab[data-t="'+k+'"]');if(tab)tab.classList.toggle('on',k===onTab);
    $('view'+k[0].toUpperCase()+k.slice(1)).classList.toggle('hidden',k!==t);
  });
  if(t==='open')renderOpen();else if(t==='new')renderNew();else if(t==='mine')renderMine();else if(t==='res')renderRes();else if(t==='admin')renderAdmin();else renderBook();
  markCalls();

}

 [['tabOpen',X.tCalls,attention.open],['tabMine',X.tMine,attention.mine],['tabRes',X.tRes,attention.res]].forEach(function(v){

 });

 if(document.hidden)return;
 fetch('/api/match/attention?initData='+encodeURIComponent(initData)+tokQ,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
  if(!j.ok)return;var changed=JSON.stringify(attention)!==JSON.stringify(j.attention);attention=j.attention||{};markCalls();

// Автор мог предложить несколько дат и кортов — отвечающий обязан выбрать конкретные.
function openPicker(id,date){
  closePicker();
  var s=openSlots.filter(function(x){return x.challenge_id===id})[0]||myMatches.filter(function(x){return x.challenge_id===id})[0];
  if(!s)return;
  var dates=s.dates.map(function(d,i){return '<div class="chip'+((date?d===date:i===0)?' on':'')+'" data-d="'+esc(d)+'" onclick="pickOne(this,\'d\')">'+esc(fmtDay(d))+'</div>'}).join('');
  // Слоты на всю длительность матча с шагом 30 минут внутри интервала автора.
  var dur=Number(s.duration_min||matchDuration);
  var lo=hm2min(s.time_from||'00:00'),hi=hm2min(s.time_to||s.time_from||'23:59');
  var times='';
  for(var t=lo;t+dur<=Math.max(hi,lo+dur);t+=30){
    times+='<div class="chip'+(t===lo?' on':'')+'" data-t="'+min2hm(t)+'" onclick="pickOne(this,\'t\')">'+min2hm(t)+'–'+min2hm(t+dur)+'</div>';
  }
  var courts=s.courts.length
    ? s.courts.map(function(c,i){return '<div class="chip'+(i===0?' on':'')+'" data-c="'+esc(c)+'" onclick="pickOne(this,\'c\')">'+esc(c)+'</div>'}).join('')
    : '<div class="hint">'+esc(X.anyCourt)+'</div>';
  var el=document.createElement('div');
  el.className='modal';el.id='picker';
  el.onclick=function(e){if(e.target===el)closePicker()};
  el.innerHTML='<div class="sheet"><h3>'+esc(X.pickTitle)+'</h3>'
    +'<div class="hint">'+esc(s.from_name)+' · '+esc(s.time_from)+(s.time_to&&s.time_to!==s.time_from?'–'+esc(s.time_to):'')+'</div>'
    +'<label>'+esc(X.pickDate)+'</label><div class="chips" id="pkDates">'+dates+'</div>'
    +'<label>'+esc(X.pickTime)+'</label><div class="chips" id="pkTimes">'+times+'</div>'
    +'<label>'+esc(X.pickCourt)+'</label><div class="chips" id="pkCourts">'+courts+'</div>'
    +'<button class="primary" onclick="confirmTake(\''+esc(id)+'\',this)">'+esc(X.accept)+'</button>'
    +'<button onclick="closePicker()">'+esc(L?'Отмена':'Cancel')+'</button>'
    +'<div id="pkRes" class="res"></div></div>';
  document.body.appendChild(el);
}

// Списки матчей везде идут от свежего к старому: ближняя дата сверху.
// Порядок один и тот же в «Моих матчах», в «Результате» и в админской вкладке,
// чтобы не приходилось привыкать заново на каждом экране.
function byFreshest(list){
  return (Array.isArray(list)?list:[]).slice().sort(function(a,b){
    return adminMatchTime(a)-adminMatchTime(b)||String(a.challenge_id||'').localeCompare(String(b.challenge_id||''));
  });
}
function adminMatchTime(s){
  var dates=(Array.isArray(s.dates)?s.dates:[]).slice().sort();
  var date=String(s.agreed_date||dates[0]||'').trim();
  var time=String(s.agreed_time||s.time_from||'00:00').trim()||'00:00';
  var value=date?Date.parse(date+'T'+time+':00+07:00'):NaN;
  if(!isNaN(value))return value;
  var created=Date.parse(String(s.created_at||''));
  return isNaN(created)?Number.MAX_SAFE_INTEGER:created;
}

      +'<div class="when">📅 <b>'+(agreed?esc(fmtDay(s.agreed_date)):s.dates.map(fmtDay).map(esc).join(' · '))+'</b> · 🕐 <b>'+esc(agreed&&s.agreed_time?(s.agreed_time+'–'+min2hm(hm2min(s.agreed_time)+Number(s.duration_min||matchDuration))):s.time_from)+'</b></div>'
      +((agreed?s.agreed_court:s.courts.join(' · '))?'<div class="meta">📍 '+esc(agreed?s.agreed_court:s.courts.join(' · '))
         +(agreed&&s.court_confirmed_at?' <span class="pill acc">'+esc(X.courtOk)+'</span>':'')+'</div>':'')
      +(agreed?courtStatus(s,iAmAuthor):'')

      +(agreed?agreedActions(s,opp):(opp.name?requestActions(s,opp):(iAmAuthor?'<div class="acts"><button class="mini" onclick="cancelSlot(\''+esc(s.challenge_id)+'\',this)">'+esc(X.cancel)+'</button></div>':'')))

// Корт ещё не подтверждён: автору — что сделать, сопернику — чего ждём,

function courtPending(s){
  return String(s.status||'')==='accepted'&&!s.court_confirmed_at&&String(s.match_type||'')!=='manual'&&!String(s.result_status||'')&&!matchEnded(s);
}
function closeLabel(ms){
  if(!ms)return '';
  var d=new Date(Number(ms)),now=new Date(),tm=d.toLocaleTimeString(L?'ru':'en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Bangkok'});
  var key=function(x){return x.toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'})};
  var tmr=new Date(now.getTime()+86400000);
  var day=key(d)===key(now)?(L?'сегодня':'today'):key(d)===key(tmr)?(L?'завтра':'tomorrow'):d.toLocaleDateString(L?'ru':'en-GB',{day:'numeric',month:'short',timeZone:'Asia/Bangkok'}).replace('.','');
  return day+' '+(L?'в':'at')+' '+tm;
}
function courtStatus(s,iAmAuthor){

// Что можно сделать с согласованным матчем: написать, перенести время, отменить.
// Перенос после подтверждения корта доступен только тому, кто корт подтверждал.
function pendingTime(s){ return String(s.time_change||'').split('|')[0]||'' }
// Счёт внёс организатор, а не кто-то из игроков: автор не совпадает ни с одной
// из сторон. Такой счёт подтверждают оба, и каждый — только один раз.
function byOrganiser(s){
  var by=String(s.result_by||'');
  return !!by&&by!==String(s.from_telegram_id)&&by!==String(s.to_telegram_id);
}
function alreadyConfirmed(s){
  return String(s.result_confirmed_by||'').split(',').map(function(x){return x.trim()})
    .indexOf(String(me&&me.id||''))>=0;
}
// Админ видит все матчи лиги. «Нужно ваше подтверждение» — только там, где он
// сам играет; в чужом матче ждём соперника, а кнопка — ручное вмешательство.
function amPlayer(s){
  var id=String(me&&me.id||'');
  return !!id&&(String(s.from_telegram_id)===id||String(s.to_telegram_id)===id);
}
function adminOnlyConfirm(s){return isAdmin&&!amPlayer(s)}
function canConfirmResult(s){
  if(byOrganiser(s))return !alreadyConfirmed(s);
  return String(s.result_by)!==String(me&&me.id);
}
// Дата и время матча в виде, который понимает Date.parse: «9:00» → «09:00».
// Из-за «9:00» без нуля кнопка «внести счёт» не появлялась вовсе.
function hhmm(t){var m=String(t||'').trim().match(/^(\d{1,2})[:.](\d{2})/);return m?(m[1].length<2?'0'+m[1]:m[1])+':'+m[2]:'00:00'}
function matchDay(s){var d=String(s.agreed_date||(Array.isArray(s.dates)?s.dates[0]:String(s.dates||'').split(',')[0])||'').trim();var m=d.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);return m?m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2):d}
function matchEnded(s){
  var d=matchDay(s),t=hhmm(s.agreed_time||s.time_from||'00:00');
  var start=Date.parse(d+'T'+t+':00+07:00');
  if(!Number.isFinite(start))return false;
  var wait=Math.min(Number(resultAfterMin)||90,Number(s.duration_min||matchDuration)||120);
  return start+wait*60000<=Date.now();
}
// День матча уже начался (00:00 по Пхукету): сыграли раньше времени — счёт
// можно внести сразу, не дожидаясь конца брони.
function matchDayStarted(s){
  var d=matchDay(s);
  var day=Date.parse(d+'T00:00:00+07:00');
  return Number.isFinite(day)&&day<=Date.now();
}
function canRetime(s){return String(s.from_telegram_id)===String(me&&me.id)}
function agreedActions(s,opp){
  var b='<div class="acts">';
  var contact=matchContactUrl(s,opp),st=String(s.result_status||'');
  if(contact)b+='<button class="mini" onclick="openLink(\''+esc(contact)+'\')">💬 '+(L?'Написать':'Message')+'</button>';
  if(st==='pending'){
    if(canConfirmResult(s))b+='<button class="mini primary" onclick="confirmPendingResult(\''+esc(s.challenge_id)+'\',this)">'+esc(X.confirmResult)+'</button>';
    else if(byOrganiser(s))b+='<span class="hint">'+esc(X.waitingOther)+'</span>';
    else b+='<button class="mini" onclick="resendResultConfirmation(\''+esc(s.challenge_id)+'\',this)">'+esc(X.resendConfirmation)+'</button>';
    return b+'</div>';
  }
  if(matchEnded(s)){
    if(st==='unfinished')b+='<button class="mini primary" onclick="openResultFromMine(\''+esc(s.challenge_id)+'\')">'+esc(X.matchCompleted)+'</button>';
    else if(!st){b+='<button class="mini primary" onclick="openResultFromMine(\''+esc(s.challenge_id)+'\')">'+esc(X.resTitle)+'</button>';b+='<button class="mini" onclick="openUnfinished(\''+esc(s.challenge_id)+'\')">'+esc(X.markUnfinished)+'</button>'}

    else b+='<button class="mini primary" onclick="openResultFromMine(\''+esc(s.challenge_id)+'\')">'+esc(X.resTitle)+'</button>';
    return b+'</div>';
  }
  if(matchDayStarted(s)&&!st&&amPlayer(s))b+='<button class="mini primary" onclick="openResultFromMine(\''+esc(s.challenge_id)+'\')">'+esc(X.resTitle)+'</button>';
  if(canRetime(s)&&!s.court_confirmed_at&&!pendingTime(s))b+='<button class="mini'+(courtPending(s)?'':' primary')+'" onclick="bookingHelper(\''+esc(s.challenge_id)+'\',this)">'+esc(L?'📲 Забронировать корт':'📲 Book court')+'</button>';
  if(canRetime(s)&&courtPending(s))b+='<button class="mini primary" onclick="confirmCourtApp(\''+esc(s.challenge_id)+'\',this)">'+esc(X.courtBtn)+'</button>';
  if(canRetime(s)&&!pendingTime(s))b+='<button class="mini" onclick="openRetime(\''+esc(s.challenge_id)+'\')">'+esc(X.retime)+'</button>';
  if(waitingOnOpponent(s))b+=nudgeButton(s);
  b+='<button class="mini" onclick="cancelMatch(\''+esc(s.challenge_id)+'\',this)">'+esc(X.cancelMatch)+'</button>';
  return b+'</div>';
}
// Ждём ли мы сейчас соперника. Точное решение всё равно принимает сервер —
// здесь мы только решаем, показывать ли кнопку, чтобы она не висела там,
// где напоминать некому.
function waitingOnOpponent(s){
  var my=String(me&&me.id||''),st=String(s.status||'').toLowerCase(),rs=String(s.result_status||'').toLowerCase();
  if(st==='open')return String(s.match_type||'')==='direct'&&String(s.from_telegram_id)===my;
  if(st==='pending')return String(s.pending_by)===my;
  if(st!=='accepted'||rs==='confirmed'||rs==='unfinished')return false;
  if(rs==='pending')return String(s.result_by)===my;
  var t=String(s.time_change||'').split('|');
  if(t[0])return String(t[1]||'')===my;
  if(!s.court_confirmed_at&&String(s.match_type||'')!=='manual')return String(s.from_telegram_id)!==my;
  return false;
}

function renderCounter(){

function bindScore(prefix){

// Имена сторон над колонками — чтобы было видно, чей результат пишется первым.
function setScoreNames(prefix,winnerName,loserName){

  var has=Boolean(winnerName);
  wrap.className=has?'':'hidden';

function setWinnerOf(a,b){
  if(a===''||b==='')return '';
  a=Number(a);b=Number(b);
  if(a===b)return '';
  return a>b?'A':'B';
}
function isTb(a,b){
  if(a===''||b==='')return false;

}
function clearVals(ids){ids.forEach(function(id){var el=$(id);if(el)el.value=''})}
function syncScore(prefix){
  var g=function(id){var el=$(prefix+id);return el?el.value:''};
  for(var n=1;n<=2;n++){
    var row=$(prefix+'tb'+n); if(!row)continue;
    var on=isTb(g('s'+n+'a'),g('s'+n+'b'));
    row.className='tbrow'+(on?'':' hidden');
    if(!on)clearVals([prefix+'s'+n+'tba',prefix+'s'+n+'tbb']);
  }
  var w1=setWinnerOf(g('s1a'),g('s1b')),w2=setWinnerOf(g('s2a'),g('s2b'));
  var split=Boolean(w1&&w2&&w1!==w2);
  var wrap=$(prefix+'set3wrap'); if(!wrap)return;

// Победитель выбирается ДО счёта: от него зависит, чьё имя стоит слева.
function pickWinner(node,prefix){
  var box=node.parentNode,loser='';
  Array.prototype.forEach.call(box.querySelectorAll('.s'),function(s){if(s!==node){s.classList.remove('on');if(s.dataset.w!=='both')loser=s.dataset.n||''}});
  node.classList.add('on');selWinner=node.dataset.w;
  if(selWinner!=='both')setScoreNames(prefix||'r',node.dataset.n||'',loser);
  orderByWinner(prefix||'r',node);

// Победитель переезжает влево — туда же, где стоит его колонка счёта. Раньше
// кнопки сверху не двигались, а имена под ними менялись местами, и человек
// вводил счёт не в ту сторону, глядя на верхний ряд.
function orderByWinner(prefix,node){
  if(!node||node.dataset.w==='both')return;
  var box=node.parentNode;
  if(box&&box.firstElementChild!==node)box.insertBefore(node,box.firstElementChild);
  var pts=$(prefix+'Points');
  var two=pts?pts.querySelector('.two'):null;
  if(!two||two.children.length<2)return;
  // Переставляем целые блоки, а не значения: id полей остаются при своих
  // игроках, поэтому points_from и points_to никуда не съезжают.
  var first=two.children[0],hint=first.querySelector('.hint');
  var name=node.dataset.n||'';
  if(name&&hint&&hint.textContent!==name)two.insertBefore(two.children[1],first);
}

      if(!keepTab){
        var want=new URLSearchParams(location.search).get('tab');
        // Пришли по кнопке «Другое время / Другой корт» — сразу экран встречного предложения.
        if(counterSlotId&&canMatch){showTab('new');return}
        var target=q.get('opponent');if(target&&canMatch&&opponents.some(function(o){return String(o.telegram_id)===target})){newMode='direct';selOpp=target;showTab('new');return}
        if(resultSlotId&&canMatch){showTab('res');return}
        // ?tab= приходит из команд бота (/match, /result, /book) — открываем нужную вкладку сразу.
        var allowed=['open','new','mine','res'];
        if(canBookCourt)allowed.push('book');if(isAdmin)allowed.push('admin');
        showTab(allowed.indexOf(want)>=0?want:'mine');
        // Переход по ссылке «Играю» из чата дивизиона — сразу открываем выбор даты и корта.
        if(focusSlot&&openSlots.some(function(s){return s.challenge_id===focusSlot}))openPicker(focusSlot);
      } else showTab(mode);
    }).catch(function(e){$('viewOpen').innerHTML='<div class="empty" style="color:#ff6b6b">'+esc(e.message)+'</div>'});
}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){showTab(b.dataset.t)}});
load();
</script>
</body>
</html>
